<!-- Load tracking: records which external libraries succeeded/failed -->
<script>
  window.__loadStatus = {};
  function __track(name) {
    return {
      onload: function () { window.__loadStatus[name] = 'ok'; },
      onerrorAttr: function () { window.__loadStatus[name] = 'FAILED'; }
    };
  }
</script>

  /* Printable content (driver logs, production shifts, work order tags,
     admin timesheet tables) is rendered via a React portal directly into
     #print-root — a plain sibling of #root, not nested anywhere inside the
     app's dark-themed screen wrappers. That matters for print specifically:
     an earlier version tried to print an element buried deep inside the
     app by hiding everything else with visibility + position:absolute, but
     Safari's print engine doesn't reliably paginate absolutely-positioned
     content past the first page (multi-page logs/tables came out blank).
     Since print-root holds nothing but the printable content in normal
     document flow, we can just hide #root entirely and let print-root
     paginate the ordinary way. */
  #print-root { display: none; }
  @media print {
    html, body { background: #fff !important; }
    #root { display: none !important; }
    #print-root { display: block !important; }
    .no-print { display: none !important; }
  }

<!-- On-screen error reporting: if anything fails, show it instead of a blank screen -->
<script>
  window.addEventListener('error', function (e) {
    const root = document.getElementById('root');
    // If the app already rendered real content, a later, unrelated error
    // (e.g. a delayed background script trying to reload) shouldn't wipe
    // out a screen that's genuinely working — only act on this if the app
    // never actually got on its feet in the first place.
    if (root.children.length > 0) return;
    // e.error (when present) carries the real Error object with a full
    // stack trace — e.message alone can come back as the browser's generic
    // "Script error." with zero detail. Prefer the real stack whenever it's there.
    const detail = (e.error && e.error.stack) ? e.error.stack : (e.message || 'Script failed to load');
    showFatalError(detail + (e.filename ? '\n\nFile: ' + e.filename + (e.lineno ? ':' + e.lineno : '') : ''));
  }, true); // capture:true so we also catch <script src> load failures, not just JS errors
  window.addEventListener('unhandledrejection', function (e) {
    const root = document.getElementById('root');
    if (root.children.length > 0) return;
    const reason = e.reason;
    const detail = (reason && reason.stack) ? reason.stack : (reason && reason.message ? reason.message : String(reason));
    showFatalError('Unhandled error: ' + detail);
  });
  function showFatalError(msg) {
    const root = document.getElementById('root');
    if (root.dataset.errorShown) return;
    root.dataset.errorShown = '1';
    const status = window.__loadStatus || {};
    const lines = ['tailwind', 'react', 'react-dom', 'babel', 'firebase-app', 'firebase-db', 'firebase-auth', 'firebase-messaging'].map(function (k) {
      return k + ': ' + (status[k] || 'never finished loading');
    });
    root.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;font-family:sans-serif;color:#ECE8DF;background:#1B1E20;text-align:center;">' +
      '<div style="max-width:520px;"><h1 style="color:#E8622C;font-size:1.4rem;">Something went wrong loading the app</h1>' +
      '<p style="margin-top:1rem;">This can happen on a fresh launch with a weak signal. Try again first:</p>' +
      '<button onclick="window.location.reload()" style="margin-top:1rem;padding:0.75rem 1.5rem;font-size:1rem;font-weight:bold;background:#7FA37E;color:#1B1F19;border:none;border-radius:8px;cursor:pointer;">Try again</button>' +
      '<p style="margin-top:1.5rem;">If it keeps happening, screenshot this and send it back:</p>' +
      '<pre style="text-align:left;background:#242829;padding:1rem;border-radius:8px;overflow:auto;font-size:0.75rem;white-space:pre-wrap;">' +
      String(msg).replace(/</g, '&lt;') + '\n\n' + lines.join('\n') + '</pre></div></div>';
  }

  // Fallback diagnostic: if nothing has rendered into #root after 6 seconds,
  // report exactly which external libraries loaded and which didn't.
  setTimeout(function () {
    const root = document.getElementById('root');
    if (root.dataset.errorShown) return;
    if (root.children.length > 0) return; // app rendered fine
    const status = window.__loadStatus || {};
    const lines = ['tailwind', 'react', 'react-dom', 'babel', 'firebase-app', 'firebase-db', 'firebase-auth', 'firebase-messaging'].map(function (k) {
      return k + ': ' + (status[k] || 'never finished loading');
    });
    showFatalError('The app never finished starting up. Here is what loaded:\n\n' + lines.join('\n'));
  }, 6000);
</script>

function PinModalOverlay({ pinModal, pinInput, setPinInput, pinError, onSubmit, onCancel, onForgot, t }) {
  const tr = t || ((k) => translations.en[k] || k);
  if (!pinModal) return null;
  const isVerify = pinModal.mode === 'verify';
  const isConfirm = pinModal.mode === 'setup' && pinModal.stage === 'confirm';
  const title = isVerify
    ? tr('enterPin')
    : isConfirm
      ? tr('confirmPin')
      : tr('createPin');

  const handleDigit = (d) => {
    if (pinInput.length >= 6) return;
    setPinInput(pinInput + d);
  };
  const handleBackspace = () => setPinInput(pinInput.slice(0, -1));

  return (
    <div className="fixed inset-0 z-50 p-6" style={{ background: 'rgba(0,0,0,0.75)', minHeight: '100vh' }}>
      <div className="w-full max-w-xs mx-auto my-8 rounded-2xl p-6 overflow-y-auto" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}`, maxHeight: '85vh' }}>

        <p className="text-sm text-center mb-5" style={{ color: COLORS.inkDim }}>{pinModal.mechanic}</p>

        <div className="flex justify-center gap-3 mb-5">
          {[0, 1, 2, 3, 4, 5].map((i) => (
            <div
              key={i}
              className="w-4 h-4 rounded-full"
              style={{
                background: i < pinInput.length ? COLORS.accent : 'transparent',
                border: `2px solid ${i < pinInput.length ? COLORS.accent : COLORS.line}`,
              }}
            />
          ))}
        </div>

        {pinError && (
          <p className="text-sm text-center mb-4 font-semibold" style={{ color: '#E07A5F' }}>{pinError}</p>
        )}

        <div className="grid grid-cols-3 gap-3 mb-4">
          {['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((d) => (
            <button
              key={d}
              onClick={() => handleDigit(d)}
              className="font-display text-2xl font-bold rounded-xl py-4 transition-all active:scale-95"
              style={{ background: COLORS.surfaceRaised, color: COLORS.ink }}

            onClick={onCancel}
            className="font-display text-xs uppercase font-bold rounded-xl py-4 transition-all active:scale-95"
            style={{ background: 'transparent', color: COLORS.inkDim }}

            Cancel

            onClick={() => handleDigit('0')}
            className="font-display text-2xl font-bold rounded-xl py-4 transition-all active:scale-95"
            style={{ background: COLORS.surfaceRaised, color: COLORS.ink }}

            {tr('forgotPin')}
          </button>
        )}
      </div>
    </div>
  );
}

function SetNewPinScreen({ state, t, onDone }) {
  const [stage, setStage] = useState('first'); // 'first' | 'confirm'
  const [firstEntry, setFirstEntry] = useState('');
  const [pin, setPin] = useState('');
  const [error, setError] = useState('');
  const [submitting, setSubmitting] = useState(false);

  if (state === 'invalid') {
    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-6 flex items-center justify-center">
        <div className="max-w-sm text-center">
          <p className="text-4xl mb-4">⚠️</p>
          <p className="text-base">{t('linkExpiredOrInvalid')}</p>
        </div>
      </div>
    );
  }

  const handleDigit = (d) => {
    const next = pin + d;
    if (next.length > 6) return;
    setPin(next);
    if (next.length === 6) {
      if (stage === 'first') {
        setFirstEntry(next);
        setPin('');
        setStage('confirm');
      } else {
        if (next !== firstEntry) {
          setError(t('pinMismatch'));
          setStage('first');
          setFirstEntry('');
          setPin('');
          return;
        }
        submitNewPin(next);
      }
    }
  };

  const submitNewPin = async (newPin) => {
    setSubmitting(true);
    setError('');
    try {
      const res = await fetch(CLOUD_FUNCTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: APP_SECRET, mode: 'resetPinWithToken', token: state.token, newPin }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'Failed');
      await firebase.auth().signInWithEmailAndPassword(emailForMechanic(state.mechanic), newPin);
      onDone(state.mechanic);
    } catch (e) {
      setError(t('linkExpiredOrInvalid'));
      setSubmitting(false);
      setStage('first');
      setFirstEntry('');
      setPin('');
    }
  };

  return (
    <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-6 flex flex-col items-center justify-center">
      <div className="max-w-xs w-full text-center">
        <p className="font-display text-2xl font-bold mb-2">{t('setNewPin')}</p>
        <p className="text-sm mb-2" style={{ color: COLORS.inkDim }}>{state.mechanic}</p>
        <p className="text-sm mb-6" style={{ color: COLORS.inkDim }}>
          {stage === 'first' ? t('setNewPinHelper') : 'Enter it again to confirm.'}
        </p>
        <div className="flex justify-center gap-2 mb-6">
          {Array.from({ length: 6 }).map((_, i) => (
            <div
              key={i}
              className="w-8 h-10 rounded-lg flex items-center justify-center text-lg font-mono"
              style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}
            >
              {pin[i] ? '•' : ''}
            </div>
          ))}
        </div>
        {error && <p className="text-sm mb-4" style={{ color: '#E07A5F' }}>{error}</p>}
        {submitting ? (
          <p className="text-sm" style={{ color: COLORS.inkDim }}>…</p>
        ) : (
          <div className="grid grid-cols-3 gap-3">
            {['1','2','3','4','5','6','7','8','9','','0','⌫'].map((d, i) =>
              d === '' ? <div key={i} /> : (
                <button
                  key={i}
                  onClick={() => (d === '⌫' ? setPin(pin.slice(0, -1)) : handleDigit(d))}
                  className="rounded-lg py-4 text-xl font-display font-bold"
                  style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
                >
                  {d}
                </button>
              )
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function FireworksOverlay({ show }) {
  if (!show) return null;
  const colors = [COLORS.accent, COLORS.done, COLORS.progress, '#F0EFE6', '#E07A5F'];
  const bursts = [
    { x: '25%', y: '35%' },
    { x: '70%', y: '25%' },
    { x: '50%', y: '55%' },
    { x: '15%', y: '65%' },
    { x: '85%', y: '60%' },
  ];
  const particles = [];
  bursts.forEach((burst, bi) => {
    for (let i = 0; i < 14; i++) {
      const angle = (Math.PI * 2 * i) / 14;
      const dist = 60 + Math.random() * 60;
      particles.push({
        key: `${bi}-${i}`,
        left: burst.x,
        top: burst.y,
        dx: Math.cos(angle) * dist + 'px',
        dy: Math.sin(angle) * dist + 'px',
        color: colors[(bi + i) % colors.length],
        size: 6 + Math.random() * 6,
        delay: bi * 0.15,
      });
    }
  });

  return (
    <div className="fixed inset-0 z-50 pointer-events-none overflow-hidden">
      {particles.map((p) => (
        <span
          key={p.key}
          className="firework-particle"
          style={{
            left: p.left,
            top: p.top,
            width: p.size,
            height: p.size,
            background: p.color,
            animationDelay: `${p.delay}s`,
            '--dx': p.dx,
            '--dy': p.dy,
          }}
        />
      ))}
    </div>
  );
}

function SignaturePad({ onChange, savedSignature }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);

  useEffect(() => {
    if (savedSignature && canvasRef.current) {
      const canvas = canvasRef.current;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      };
      img.src = savedSignature;
      onChange(savedSignature);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const getPos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
  };

  const start = (e) => {
    e.preventDefault();
    drawing.current = true;
    const ctx = canvasRef.current.getContext('2d');
    const { x, y } = getPos(e);
    ctx.beginPath();
    ctx.moveTo(x, y);
  };
  const move = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext('2d');
    const { x, y } = getPos(e);
    ctx.lineTo(x, y);
    ctx.strokeStyle = '#1B1F19';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.stroke();
    onChange(canvasRef.current.toDataURL('image/png'));
  };
  const end = () => { drawing.current = false; };
  const clear = () => {
    const canvas = canvasRef.current;
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    onChange(null);
  };

  return (
    <div>
      {savedSignature && (
        <p className="text-xs mb-2" style={{ color: COLORS.accent }}>Using your saved signature — clear it below if you'd like to redraw.</p>
      )}
      <canvas
        ref={canvasRef}
        width={320}
        height={140}
        onMouseDown={start}
        onMouseMove={move}
        onMouseUp={end}
        onMouseLeave={end}
        onTouchStart={start}
        onTouchMove={move}
        onTouchEnd={end}
        className="w-full rounded-lg"
        style={{ background: '#fff', border: `2px solid ${COLORS.line}`, touchAction: 'none', display: 'block' }}
      />
      <button type="button" onClick={clear} className="text-xs underline mt-2" style={{ color: COLORS.inkDim }}>Clear signature</button>
    </div>
  );
}

// Simple placeholder terrain, standing in for a real georeferenced map
// until one is actually uploaded — matches the app's own dark theme rather

const MAP_VIEWBOX = { width: 560, height: 400 };
function PlaceholderTerrainContent() {

      <path d="M0,200 L560,180" stroke={COLORS.line} strokeWidth="10" opacity="0.4" />

function PlaceholderTerrain() {
  return (
    <svg viewBox={`0 0 ${MAP_VIEWBOX.width} ${MAP_VIEWBOX.height}`} style={{ width: '100%', display: 'block', background: COLORS.surface }}>

// The actual interactive map surface — terrain plus every visible pin on
// top of it. In placement mode, tapping anywhere reports back the tapped
// spot in the map's own coordinate space; otherwise, tapping an existing
// pin reports which one was tapped. Uses the SVG's own coordinate
// transform (getScreenCTM) rather than plain click-position math, since
// that's what reliably survives the page being scaled to fit the screen.
function MapCanvas({ pinsToShow, placingPin, onMapTap, onPinTap }) {
  const svgRef = useRef(null);

  const handleClick = (e) => {
    if (!placingPin || !svgRef.current) return;
    const svg = svgRef.current;
    const screenCTM = svg.getScreenCTM();
    if (!screenCTM) return;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    const local = pt.matrixTransform(screenCTM.inverse());
    onMapTap(Math.round(local.x), Math.round(local.y));
  };

  return (
    <svg
      ref={svgRef}
      viewBox={`0 0 ${MAP_VIEWBOX.width} ${MAP_VIEWBOX.height}`}
      style={{ width: '100%', display: 'block', background: COLORS.surface, cursor: placingPin ? 'crosshair' : 'default', touchAction: 'manipulation' }}
      onClick={handleClick}
    >
      <PlaceholderTerrainContent />
      {pinsToShow.map((pin) => {
        const def = PIN_TYPES[pin.type];
        return (
          <g
            key={pin.id}
            transform={`translate(${pin.x}, ${pin.y})`}
            onClick={(e) => { e.stopPropagation(); if (!placingPin) onPinTap(pin.id); }}
            style={{ cursor: placingPin ? 'crosshair' : 'pointer' }}
          >
            <circle r="11" fill={def.color} stroke="#fff" strokeWidth="2" />
            <text textAnchor="middle" y="5" fontSize="12">{def.icon}</text>
          </g>
        );
      })}
    </svg>
  );
}

// Mirrors the last-known data into localStorage so mechanics can still SEE

// New changes made offline still rely on Firebase's own queue-and-sync,

// reconnecting — this cache is purely for offline viewing, not writes.
function cacheGet(key, fallback) {
  try {
    const raw = localStorage.getItem('cache_' + key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
function cacheSet(key, value) {
  try {
    localStorage.setItem('cache_' + key, JSON.stringify(value));

    // storage full or unavailable — offline viewing just won't have this data

}

  } catch (e) {

}

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtTime(iso) {
  if (!iso) return '';
  // hour12 forced explicitly so this always shows AM/PM regardless of the
  // phone's system time format setting (some Android phones default to 24-hour).
  return new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', hour12: true });
}

// Total paid hours for a shift: clock-in to clock-out, minus any unpaid break.
function entryHours(entry) {
  if (!entry.clockIn || !entry.clockOut) return 0;
  let ms = new Date(entry.clockOut) - new Date(entry.clockIn);
  if (entry.lunchStart && entry.lunchEnd) {
    ms -= new Date(entry.lunchEnd) - new Date(entry.lunchStart);
  }
  return Math.max(0, ms / 1000 / 60 / 60);
}

function fmtHours(h) {
  const totalMinutes = Math.round((h || 0) * 60);
  const hrs = Math.floor(totalMinutes / 60);
  const mins = totalMinutes % 60;
  if (hrs === 0) return `${mins}m`;
  if (mins === 0) return `${hrs}h`;
  return `${hrs}h ${mins}m`;
}

// Decimal hours — used only for the CSV export, since a bookkeeper opening
// it in Excel can sum a column of decimals but not "3h 30m" text.
function fmtHoursDecimal(h) {
  return (h || 0).toFixed(2).replace(/\.00$/, '');
}

// Pay week runs Sunday–Saturday. Given any date string ('YYYY-MM-DD'),
// return that week's Sunday as the week's identifying key.
// .toISOString() always returns UTC, never local time — using it for
// "today's date" silently rolls the date forward by one during evening
// hours in any US timezone, since UTC has already crossed into the next
// calendar day while it's still today locally. This is the correct way to
// get today's actual local date as a string.
function localDateStr(d) {
  const date = d || new Date();
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}
function weekStartOf(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() - d.getDay());
  return d.toISOString().slice(0, 10);
}
function weekEndOf(weekStart) {
  const d = new Date(weekStart + 'T00:00:00');
  d.setDate(d.getDate() + 6);
  return d.toISOString().slice(0, 10);
}
function fmtWeekRange(weekStart) {
  const end = weekEndOf(weekStart);
  return `${fmtDate(weekStart)} – ${fmtDate(end)}`;
}

// Resize + compress a photo before storing it, so the shared database stays fast
// to sync over a mechanic's cell signal out in the field.
function compressImage(file, maxDim = 1280, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Firebase Realtime Database rejects an entire write if ANY value anywhere
// in it is undefined (not null — undefined specifically), even deeply
// nested and even if the rest of the data is fine. This round-trip through
// JSON strips those out automatically, since JSON.stringify silently omits
// undefined properties.
function stripUndefined(data) {
  return JSON.parse(JSON.stringify(data));
}

// Every save to these paths is a full read-modify-write of the whole list —
// safe ONLY if the local copy is guaranteed complete first. If anyone's
// phone writes before Firebase has finished syncing the real data down to
// it, this silently overwrites everything else with whatever little that
// phone had loaded. This check catches that specific failure mode before it
// can happen again: compare against a fresh, guaranteed-current read of the
// server, and refuse to write if the new list is suspiciously smaller than
// what's actually there right now. A single legitimate delete is still
// allowed through; a mass unexplained drop is not.
async function safeToOverwrite(path, nextArray) {
  try {
    const snap = await firebase.database().ref(path).once('value');
    const serverArray = snap.val() || [];
    if (nextArray.length < serverArray.length - 2) {
      return { ok: false, serverCount: serverArray.length, nextCount: nextArray.length };
    }
    return { ok: true };
  } catch (e) {
    // Can't verify right now (offline, etc.) — don't block a genuine
    // offline save over this; the real protection is the check itself
    // succeeding whenever there's a connection to check against.
    return { ok: true };
  }
}

function getLocalizedText(field, lang) {
  if (!field) return '';
  if (typeof field === 'string') return field;

async function buildLocalizedField(text, currentLang) {

// One-way hash so raw PINs are never stored or sent anywhere in plain text.
async function sha256Hex(text) {
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

function webauthnKey(name) {
  return 'webauthn_cred_' + name;
}

async function webauthnAvailable() {
  return !!(
    window.PublicKeyCredential &&
    window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable &&
    (await window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())
  );
}

// Registers Face ID / Touch ID (or Windows Hello, etc.) as a shortcut on THIS device only.
// The credential never leaves the device — it's just a local unlock, not shared identity proof.
async function registerBiometric(name) {
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge,
      rp: { name: 'Harder Contracting Work Orders' },
      user: {
        id: new TextEncoder().encode(name),
        name,
        displayName: name,
      },
      pubKeyCredParams: [
        { type: 'public-key', alg: -7 },
        { type: 'public-key', alg: -257 },
      ],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
      timeout: 60000,
    },
  });
  const credIdB64 = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
  localStorage.setItem(webauthnKey(name), credIdB64);
}

async function verifyBiometric(name) {
  const credIdB64 = localStorage.getItem(webauthnKey(name));
  if (!credIdB64) return false;
  try {
    const credId = Uint8Array.from(atob(credIdB64), (c) => c.charCodeAt(0));
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    await navigator.credentials.get({
      publicKey: {
        challenge,
        allowCredentials: [{ id: credId, type: 'public-key' }],
        userVerification: 'required',
        timeout: 60000,
      },
    });
    return true;
  } catch (e) {
    return false;
  }
}

// Every unit is now a real Work Order Board unit, tagged with a type via
// /unitTypes — there's no separate hardcoded machine list anymore. Mechanics
// still use the plain clock in/out; production-tagged units get the fields
// below based on their tag.
function machineType(name, unitTypesMap) {
  return (unitTypesMap || {})[slugForUnit(name || '')];
}
function productionSummary(s, unitTypesMap) {
  const type = machineType(s.machine, unitTypesMap);
  if (type === 'buncher') return s.trees ? `${s.trees} trees` : '—';
  if (type === 'skidder' || type === 'processor') {
    const parts = [];
    if (s.spruce) parts.push(`${s.spruce} spruce`);
    if (s.aspen) parts.push(`${s.aspen} aspen`);
    return parts.length ? parts.join(', ') : '—';
  }
  if (type === 'loader') {
    const parts = [];
    if (s.loadCount) parts.push(`${s.loadCount} loads`);
    if (s.topPileCount) parts.push(`${s.topPileCount} top piles`);
    return parts.length ? parts.join(', ') : '—';
  }
  if (type === 'fuel') {
    const total = Object.values(s.fuelLog || {}).flat().reduce((sum, v) => sum + (parseFloat(v) || 0), 0);
    return total > 0 ? `${total} L delivered` : '—';
  }
  return '—';
}

// A day with just one status the whole time reads much more clearly as
// "Off Duty" than as "1 status change" — the count only actually helps
// once there's more than one thing to summarize.
function driverDaySummaryLabel(statusChanges) {
  const list = statusChanges || [];
  if (list.length === 1) return DUTY_STATUS_LABELS[list[0].status];
  return `${list.length} status changes`;
}

// Turns a list of discrete status-change timestamps into total hours spent
// in each status — each segment runs from one change to the next, with the
// final (or only, if still open) segment running until endTime/now.
function computeDutyDurations(statusChanges, endTime) {
  const totals = { off: 0, sleeper: 0, driving: 0, onDuty: 0 };
  const sorted = [...(statusChanges || [])].sort((a, b) => new Date(a.time) - new Date(b.time));
  for (let i = 0; i < sorted.length; i++) {
    const segStart = new Date(sorted[i].time);
    const segEnd = i + 1 < sorted.length ? new Date(sorted[i + 1].time) : new Date(endTime || Date.now());
    const hrs = Math.max(0, (segEnd - segStart) / 1000 / 60 / 60);
    totals[sorted[i].status] = (totals[sorted[i].status] || 0) + hrs;
  }
  return totals;
}

                <p className="text-xs font-semibold" style={{ color: item.severity === 'major' ? '#E07A5F' : COLORS.progress }}>
                  {item.severity === 'major' ? '🔴 MAJOR' : '🟡 Minor'} — {item.label}
                </p>
                {item.note && <p className="text-xs mt-1">{item.note}</p>}
                {(item.photos || []).length > 0 && (
                  <div className="flex gap-1 mt-1 flex-wrap">
                    {item.photos.map((p, pi) => <img key={pi} src={p} alt="" style={{ width: 50, height: 50, objectFit: 'cover', borderRadius: 4 }} />)}
                  </div>
                )}
              </div>
            ))}
          </div>
        );
      })}

      {inspection.signature && (
        <div className="mt-2">
          <p className="text-xs mb-1" style={{ color: COLORS.done }}>✓ Signed</p>
          <img src={inspection.signature} alt="Signature" style={{ height: 50, background: '#fff', borderRadius: 4 }} />
        </div>
      )}

      {confirmDelete ? (
        <div className="rounded-lg p-3 mt-3" style={{ background: COLORS.surfaceRaised }}>
          <p className="text-sm mb-2" style={{ color: COLORS.inkDim }}>Delete this inspection? This can't be undone.</p>
          <div className="flex gap-2">
            <Btn variant="danger" onClick={onDelete}>Yes, delete it</Btn>
            <Btn variant="ghost" onClick={() => setConfirmDelete(false)}>Cancel</Btn>
          </div>
        </div>
      ) : (
        <button onClick={() => setConfirmDelete(true)} className="text-xs underline mt-3" style={{ color: '#E07A5F' }}>Delete this inspection</button>
      )}
    </div>
  );
}

function PreTripInspectionForm({ driver, truckUnitName, onSubmit, onCancel }) {
  const [unitsData, setUnitsData] = useState([
    { unitName: truckUnitName, unitType: 'truck', items: TRUCK_PRETRIP_ITEMS.map((def) => ({ ...def, status: null, severity: null, note: '', photos: [] })) },
  ]);
  const [expandedUnitIndex, setExpandedUnitIndex] = useState(0);
  const [addingTrailer, setAddingTrailer] = useState(false);
  const [newTrailerName, setNewTrailerName] = useState('');
  const [signature, setSignature] = useState(null);
  const [submitting, setSubmitting] = useState(false);

  const setItemStatus = (unitIdx, itemIdx, status) => {
    setUnitsData((prev) => prev.map((u, ui) => (ui !== unitIdx ? u : {
      ...u,
      items: u.items.map((item, ii) => (ii !== itemIdx ? item : { ...item, status, severity: status === 'good' ? null : item.severity })),
    })));
  };
  const updateItemDetail = (unitIdx, itemIdx, patch) => {
    setUnitsData((prev) => prev.map((u, ui) => (ui !== unitIdx ? u : {
      ...u,
      items: u.items.map((item, ii) => (ii !== itemIdx ? item : { ...item, ...patch })),
    })));
  };
  const addPhotoToItem = (unitIdx, itemIdx, dataUrl) => {
    setUnitsData((prev) => prev.map((u, ui) => (ui !== unitIdx ? u : {
      ...u,
      items: u.items.map((item, ii) => (ii !== itemIdx ? item : { ...item, photos: [...(item.photos || []), dataUrl] })),
    })));
  };
  const addTrailer = () => {
    if (!newTrailerName.trim()) return;
    setUnitsData((prev) => [...prev, { unitName: newTrailerName.trim(), unitType: 'trailer', items: TRAILER_PRETRIP_ITEMS.map((def) => ({ ...def, status: null, severity: null, note: '', photos: [] })) }]);
    setExpandedUnitIndex(unitsData.length);
    setNewTrailerName('');
    setAddingTrailer(false);
  };

  const allAnswered = unitsData.every((u) => u.items.every((item) => item.status !== null));
  const deficienciesMissingSeverity = unitsData.some((u) => u.items.some((item) => item.status === 'deficiency' && !item.severity));
  const hasMajor = unitsData.some((u) => u.items.some((item) => item.status === 'deficiency' && item.severity === 'major'));
  const readyToSign = allAnswered && !deficienciesMissingSeverity;

  return (
    <div className="p-5 font-body" style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }}>
      <div className="flex items-center justify-between mb-4">
        <h1 className="font-display text-xl font-bold">Pre-Trip Inspection</h1>
        <button onClick={onCancel} className="text-2xl" style={{ color: COLORS.inkDim }}>✕</button>
      </div>

      {unitsData.map((u, unitIdx) => (
        <PreTripUnitSection
          key={unitIdx}
          unit={u}
          unitIdx={unitIdx}
          expanded={expandedUnitIndex === unitIdx}
          onToggle={() => setExpandedUnitIndex(expandedUnitIndex === unitIdx ? null : unitIdx)}
          onSetStatus={setItemStatus}
          onUpdateDetail={updateItemDetail}
          onAddPhoto={addPhotoToItem}
        />
      ))}

      {addingTrailer ? (
        <div className="rounded-lg p-4 mb-4" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
          <TextInput value={newTrailerName} onChange={(e) => setNewTrailerName(e.target.value)} placeholder="Trailer unit name/number" className="w-full mb-2" />
          <div className="flex gap-2">
            <Btn onClick={addTrailer} disabled={!newTrailerName.trim()}>Add trailer</Btn>
            <Btn variant="ghost" onClick={() => { setAddingTrailer(false); setNewTrailerName(''); }}>Cancel</Btn>
          </div>
        </div>
      ) : (
        <button onClick={() => setAddingTrailer(true)} className="w-full rounded-lg p-3 mb-4 text-sm" style={{ border: `2px dashed ${COLORS.accent}`, color: COLORS.accent }}>
          + Add a trailer
        </button>
      )}

      {hasMajor && (
        <div className="rounded-lg p-4 mb-4" style={{ background: '#E07A5F', color: '#1B1F19' }}>
          <p className="font-bold text-sm">⚠ Major defect found</p>
          <p className="text-xs mt-1">By law, this vehicle should not be driven until it's repaired. You can still submit this inspection and choose to drive — that decision, and the risk of a separate citation, is yours.</p>
        </div>
      )}

      {readyToSign ? (
        <div className="rounded-lg p-4" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
          <p className="text-xs mb-2" style={{ color: COLORS.inkDim }}>Sign to confirm this inspection is accurate:</p>
          <SignaturePad onChange={setSignature} savedSignature={localStorage.getItem('savedSignature_' + driver)} />
          <div className="flex gap-2 mt-3">
            <Btn
              onClick={async () => {
                setSubmitting(true);
                if (signature) localStorage.setItem('savedSignature_' + driver, signature);
                await onSubmit(unitsData, signature);
                setSubmitting(false);
              }}
              disabled={!signature || submitting}
            >
              {submitting ? '…' : 'Submit inspection'}
            </Btn>
            <Btn variant="ghost" onClick={onCancel}>Cancel</Btn>
          </div>
        </div>
      ) : (
        <p className="text-xs text-center" style={{ color: COLORS.inkDim }}>Check every item on every unit to continue.</p>
      )}
    </div>
  );
}

// Locked-down, read-only view meant for handing the phone directly to an
// inspecting officer. Alberta's regulation is specific about what a driver
// needs to produce on request: the record of duty status for "the current
// 24-hour period and the previous 14 consecutive days" — nothing about the
// rest of the app, no editing, no navigation elsewhere. This shows exactly
// that and nothing more, with one clear way back out.
function InspectionModeScreen({ driver, allLogs, onExit }) {
  const [confirmingExit, setConfirmingExit] = useState(false);
  const [exitPin, setExitPin] = useState('');
  const [exitError, setExitError] = useState('');
  const [verifying, setVerifying] = useState(false);

  const myLogs = allLogs.filter((l) => l.driver === driver);
  const today = new Date();
  const last14Dates = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    last14Dates.push(localDateStr(d));
  }
  const recentLogs = myLogs
    .filter((l) => last14Dates.includes(l.start.slice(0, 10)))
    .sort((a, b) => b.start.localeCompare(a.start));
  const currentLog = myLogs.find((l) => !l.end) || recentLogs[0] || null;

  const attemptExit = async () => {
    if (exitPin.length < 4) return;
    setVerifying(true);
    setExitError('');
    try {
      // Re-checks the PIN against the driver's real account, the same way
      // login itself does — this doesn't touch or disrupt the session
      // that's already active, it's purely a verify step. Wrong PIN simply
      // rejects here without signing anyone out.
      await firebase.auth().signInWithEmailAndPassword(emailForMechanic(driver), exitPin);
      onExit();
    } catch (e) {
      setExitError('Wrong PIN — try again');
      setExitPin('');
    } finally {
      setVerifying(false);
    }
  };

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 500, background: COLORS.bg, color: COLORS.ink, overflowY: 'auto' }} className="font-body p-5">
      <div className="flex items-center justify-between mb-6" style={{ paddingTop: 'env(safe-area-inset-top, 0px)' }}>
        <div>
          <p className="font-display text-xs uppercase tracking-wide" style={{ color: COLORS.accent }}>Inspection Mode</p>
          <h1 className="font-display text-xl font-bold">{driver}</h1>
        </div>
        <Btn variant="ghost" onClick={() => setConfirmingExit(true)}>Exit</Btn>
      </div>

      {confirmingExit && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 600, background: 'rgba(0,0,0,0.85)', display: 'flex', alignItems: 'center', justifyContent: 'center' }} className="p-6">
          <div className="w-full max-w-xs rounded-2xl p-6" style={{ background: COLORS.surface, border: `2px solid ${COLORS.accent}` }}>
            <p className="font-display text-lg font-bold text-center mb-1">Enter your PIN to exit</p>
            <p className="text-xs text-center mb-4" style={{ color: COLORS.inkDim }}>Only {driver} can leave Inspection Mode</p>
            <input
              type="password"
              inputMode="numeric"
              maxLength={6}
              autoFocus
              value={exitPin}
              onChange={(e) => { setExitPin(e.target.value.replace(/\D/g, '')); setExitError(''); }}
              onKeyDown={(e) => { if (e.key === 'Enter') attemptExit(); }}
              className="w-full rounded-lg px-4 py-3 text-2xl text-center tracking-[0.5em] font-mono mb-2 focus:outline-none focus:ring-2"
              style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
            />
            {exitError && <p className="text-xs text-center mb-2" style={{ color: '#E07A5F' }}>{exitError}</p>}
            <div className="flex gap-2 mt-3">
              <Btn onClick={attemptExit} disabled={exitPin.length < 4 || verifying}>{verifying ? '…' : 'Exit'}</Btn>
              <Btn variant="ghost" onClick={() => { setConfirmingExit(false); setExitPin(''); setExitError(''); }}>Cancel</Btn>
            </div>
          </div>
        </div>
      )}

      {currentLog ? (
        <div className="mb-6">
          <p className="text-xs uppercase tracking-wide mb-2" style={{ color: COLORS.inkDim }}>
            {currentLog.end ? 'Most recent log' : 'Current log'} — {fmtDate(currentLog.start)}
          </p>
          <div className="rounded-lg overflow-hidden" style={{ border: `2px solid ${COLORS.line}` }}>
            <DriverLogGrid log={currentLog} />
          </div>
        </div>
      ) : (
        <p className="text-sm mb-6" style={{ color: COLORS.inkDim }}>No logs on record.</p>
      )}

      <p className="text-xs uppercase tracking-wide mb-2" style={{ color: COLORS.inkDim }}>Last 14 days</p>
      {recentLogs.length === 0 ? (
        <p className="text-sm" style={{ color: COLORS.inkDim }}>No logs in the last 14 days.</p>
      ) : (
        <div className="space-y-2">
          {recentLogs.map((l) => (
            <div key={l.id} className="rounded-lg p-3" style={{ background: COLORS.surfaceRaised }}>
              <div className="flex items-center justify-between">
                <span className="font-semibold text-sm">{fmtDate(l.start)}</span>
                <span className="text-xs" style={{ color: l.signature ? COLORS.done : '#E07A5F' }}>{l.signature ? '✓ Signed' : 'Not signed'}</span>
              </div>
              <p className="text-xs mt-1" style={{ color: COLORS.inkDim }}>
                {driverDaySummaryLabel(l.statusChanges)}{!l.end ? ' · Still open' : ''}
              </p>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}


// Alberta requires the driver to have the last 14 days of logs on hand —
// this shows exactly that, flags any gaps, and lets a stretch of no
// driving get backfilled as a full day of Off Duty, all covered by one
// signature rather than needing to sign each day separately.
function DriverRecentLogsSection({ driver, allLogs, onBackfillOffDuty }) {
  const [backfilling, setBackfilling] = useState(false);
  const [signature, setSignature] = useState(null);

  const today = new Date();
  const last14Dates = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    last14Dates.push(localDateStr(d));
  }

  const myLogs = allLogs.filter((l) => l.driver === driver);
  const datesWithLogs = new Set(myLogs.map((l) => l.start.slice(0, 10)));
  const missingDates = last14Dates.filter((d) => !datesWithLogs.has(d));
  const recentLogs = myLogs
    .filter((l) => last14Dates.includes(l.start.slice(0, 10)))
    .sort((a, b) => b.start.localeCompare(a.start));

  return (
    <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
      <p className="font-display text-sm font-bold uppercase tracking-wide mb-1" style={{ color: COLORS.accent }}>Recent Logs</p>
      <p className="text-xs mb-4" style={{ color: COLORS.inkDim }}>Alberta requires the last 14 days of logs to be on hand.</p>

      {missingDates.length > 0 && (
        <div className="rounded-lg p-3 mb-4" style={{ background: COLORS.surfaceRaised, border: `1px solid ${COLORS.accent}` }}>
          <p className="text-sm mb-2">{missingDates.length} day{missingDates.length > 1 ? 's' : ''} missing a log in the last 14.</p>
          {backfilling ? (
            <div>
              <p className="text-xs mb-2" style={{ color: COLORS.inkDim }}>
                Fills in {missingDates.length} day{missingDates.length > 1 ? 's' : ''} as Off Duty, all day. Sign once to confirm:
              </p>
              <SignaturePad onChange={setSignature} savedSignature={localStorage.getItem('savedSignature_' + driver)} />
              <div className="flex gap-2 mt-3">
                <Btn
                  onClick={async () => {
                    if (signature) localStorage.setItem('savedSignature_' + driver, signature);
                    await onBackfillOffDuty(missingDates, signature);
                    setBackfilling(false); setSignature(null);
                  }}
                  disabled={!signature}
                >
                  Confirm — fill in all {missingDates.length}
                </Btn>
                <Btn variant="ghost" onClick={() => setBackfilling(false)}>Cancel</Btn>
              </div>
            </div>
          ) : (
            <Btn onClick={() => setBackfilling(true)}>Backfill as Off Duty</Btn>
          )}
        </div>
      )}

      {recentLogs.length === 0 ? (
        <p className="text-sm" style={{ color: COLORS.inkDim }}>No logs yet.</p>
      ) : (
        <div className="space-y-2">
          {recentLogs.map((l) => (
            <div key={l.id} className="rounded-lg p-3" style={{ background: COLORS.surfaceRaised }}>
              <div className="flex items-center justify-between">
                <span className="font-semibold text-sm">{fmtDate(l.start)}</span>
                <span className="text-xs" style={{ color: l.signature ? COLORS.done : '#E07A5F' }}>{l.signature ? '✓ Signed' : 'Not signed'}</span>
              </div>
              <p className="text-xs mt-1" style={{ color: COLORS.inkDim }}>
                {driverDaySummaryLabel(l.statusChanges)}{!l.end ? ' · Still open' : ''}
              </p>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function DriverLogSection({ driver, openLog, allLogs, onStart, onAddStatus, onEnd, onUpdateStatusChange, hasValidInspection, inspectionHoursRemaining, onOpenPreTrip, onOpenInspectionMode, isAdmin }) {
  const [startingLog, setStartingLog] = useState(false);
  const [odometerStartDraft, setOdometerStartDraft] = useState('');
  const [pendingStatus, setPendingStatus] = useState(null);
  const [noteDraft, setNoteDraft] = useState('');
  const [endingLog, setEndingLog] = useState(false);
  const [odometerEndDraft, setOdometerEndDraft] = useState('');
  const [signature, setSignature] = useState(null);

  const todayTotals = openLog ? computeDutyDurations(openLog.statusChanges, null) : null;

  const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const relevantLogs = (allLogs || []).filter((l) => l.driver === driver && new Date(l.start).getTime() >= sevenDaysAgo);
  const cycleOnDutyHours = relevantLogs.reduce((sum, l) => {
    const t = computeDutyDurations(l.statusChanges, l.end);
    return sum + t.driving + t.onDuty;
  }, 0);

  const currentStatus = openLog && openLog.statusChanges && openLog.statusChanges.length > 0
    ? openLog.statusChanges[openLog.statusChanges.length - 1].status
    : null;

  const warnColor = (value, limit) => (value >= limit ? '#E07A5F' : value >= limit - 1 ? COLORS.progress : COLORS.ink);

  return (
    <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `2px solid ${COLORS.accent}` }}>
      <div className="flex items-center justify-between mb-1 no-print">
        <p className="font-display text-sm font-bold uppercase tracking-wide" style={{ color: COLORS.accent }}>Driver Log Book</p>
        <div className="flex gap-2">
          {isAdmin && openLog && openLog.statusChanges && openLog.statusChanges.length > 0 && (
            <button
              onClick={() => window.print()}
              className="text-xs font-semibold px-3 py-1.5 rounded-lg"
              style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
            >
              🖨️ Print
            </button>
          )}
          <button
            onClick={onOpenInspectionMode}
            className="text-xs font-semibold px-3 py-1.5 rounded-lg"
            style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
          >
            🚔 Inspection Mode
          </button>
        </div>
      </div>
      <p className="text-xs mb-4 no-print" style={{ color: COLORS.inkDim }}>Separate from your regular clock — this tracks hours of service.</p>
      {isAdmin && openLog && openLog.statusChanges && openLog.statusChanges.length > 0 && (
        <PrintPortal>
          <PrintableDriverLog log={openLog} driverName={driver} />
        </PrintPortal>
      )}

      {!openLog ? (
        !hasValidInspection ? (
          <div className="rounded-lg p-4 mb-3" style={{ background: '#E07A5F', color: '#1B1F19' }}>
            <p className="text-sm font-bold mb-2">A pre-trip inspection is required before you can start your log.</p>
            <p className="text-xs mb-3">You don't have one on record from the last 24 hours.</p>
            <Btn onClick={onOpenPreTrip}>Do pre-trip inspection</Btn>
          </div>
        ) : startingLog ? (
          <div>
            <label className="block mb-3">
              <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Odometer — start of day</span>
              <TextInput type="number" inputMode="numeric" value={odometerStartDraft} onChange={(e) => setOdometerStartDraft(e.target.value)} />
            </label>
            <div className="flex gap-2">
              <Btn onClick={async () => { await onStart(odometerStartDraft); setStartingLog(false); setOdometerStartDraft(''); }}>Start log</Btn>
              <Btn variant="ghost" onClick={() => setStartingLog(false)}>Cancel</Btn>
            </div>
          </div>
        ) : (
          <div>
            {inspectionHoursRemaining !== null && inspectionHoursRemaining < 15 && (
              <div className="rounded-lg p-3 mb-3" style={{ background: COLORS.surfaceRaised, border: `1px solid ${COLORS.progress}` }}>
                <p className="text-sm font-semibold" style={{ color: COLORS.progress }}>Heads up — your pre-trip expires in about {Math.max(0, Math.round(inspectionHoursRemaining))}h</p>
                <p className="text-xs mt-1" style={{ color: COLORS.inkDim }}>If today's shift might run long, doing a fresh inspection now means it won't run out partway through your day.</p>
                <button onClick={onOpenPreTrip} className="text-xs underline mt-2" style={{ color: COLORS.accent }}>Do a fresh pre-trip now</button>
              </div>
            )}
            <Btn onClick={() => setStartingLog(true)}>Start driver log</Btn>
            <button onClick={onOpenPreTrip} className="block w-full text-center text-xs underline mt-3" style={{ color: COLORS.inkDim }}>Redo pre-trip inspection</button>
          </div>
        )
      ) : (
        <div>
          <div className="grid grid-cols-2 gap-3 mb-4">
            <div className="rounded-lg p-3" style={{ background: COLORS.surfaceRaised }}>
              <p className="text-xs" style={{ color: COLORS.inkDim }}>Driving today</p>
              <p className="font-display text-lg font-bold" style={{ color: warnColor(todayTotals.driving, HOS_LIMITS.driving) }}>{fmtHours(todayTotals.driving)}</p>
              {todayTotals.driving >= HOS_LIMITS.driving && <p className="text-xs" style={{ color: '#E07A5F' }}>⚠ Over 13hr driving limit</p>}
            </div>
            <div className="rounded-lg p-3" style={{ background: COLORS.surfaceRaised }}>
              <p className="text-xs" style={{ color: COLORS.inkDim }}>On-duty today</p>
              <p className="font-display text-lg font-bold" style={{ color: warnColor(todayTotals.driving + todayTotals.onDuty, HOS_LIMITS.onDuty) }}>{fmtHours(todayTotals.driving + todayTotals.onDuty)}</p>
              {(todayTotals.driving + todayTotals.onDuty) >= HOS_LIMITS.onDuty && <p className="text-xs" style={{ color: '#E07A5F' }}>⚠ Over 15hr on-duty limit</p>}
            </div>
          </div>
          <div className="rounded-lg p-3 mb-4" style={{ background: COLORS.surfaceRaised }}>
            <p className="text-xs" style={{ color: COLORS.inkDim }}>On-duty, last 7 days</p>
            <p className="font-display text-lg font-bold" style={{ color: warnColor(cycleOnDutyHours, HOS_LIMITS.cycle7day) }}>{fmtHours(cycleOnDutyHours)} / 70h</p>
            {cycleOnDutyHours >= HOS_LIMITS.cycle7day && <p className="text-xs" style={{ color: '#E07A5F' }}>⚠ Over 70hr/7-day limit</p>}
          </div>

          {currentStatus && (
            <p className="text-sm mb-3">Currently: <span className="font-semibold" style={{ color: COLORS.accent }}>{DUTY_STATUS_LABELS[currentStatus]}</span></p>
          )}

          {pendingStatus ? (
            <div className="mb-4">
              <p className="text-xs mb-2" style={{ color: COLORS.inkDim }}>What are you doing? (e.g. loading up, fueling, checking load)</p>
              <TextInput value={noteDraft} onChange={(e) => setNoteDraft(e.target.value)} placeholder="Note" className="w-full mb-2" />
              <div className="flex gap-2">
                <Btn onClick={async () => { await onAddStatus(pendingStatus, noteDraft); setPendingStatus(null); setNoteDraft(''); }}>Log it</Btn>
                <Btn variant="ghost" onClick={() => { setPendingStatus(null); setNoteDraft(''); }}>Cancel</Btn>
              </div>
            </div>
          ) : (
            <div className="grid grid-cols-2 gap-2 mb-4">
              {Object.entries(DUTY_STATUS_LABELS).map(([status, label]) => (
                <button
                  key={status}
                  onClick={() => (status === 'onDuty' ? setPendingStatus(status) : onAddStatus(status, ''))}
                  disabled={currentStatus === status}
                  className="rounded-lg px-3 py-3 text-sm font-semibold text-center"
                  style={{ background: currentStatus === status ? COLORS.accent : COLORS.surfaceRaised, color: currentStatus === status ? COLORS.ink2 : COLORS.ink, border: `1px solid ${COLORS.line}`, opacity: currentStatus === status ? 0.6 : 1 }}
                >
                  {label}
                </button>
              ))}
            </div>

            <div className="mb-4">
              <DriverLogGrid log={openLog} onUpdateChangeTime={(changeId, newTime) => onUpdateStatusChange(openLog.id, changeId, { time: newTime })} />
            </div>

          {openLog.statusChanges && openLog.statusChanges.length > 0 && (
            <div className="mb-4 space-y-1">

                  <span style={{ color: COLORS.inkDim }}>{fmtTime(c.time)} — {DUTY_STATUS_LABELS[c.status]}</span>
                  {c.note && <span style={{ color: COLORS.ink, textAlign: 'right' }}>{c.note}</span>}
                </div>

            <div>
              <label className="block mb-3">
                <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Odometer — end of day</span>
                <TextInput type="number" inputMode="numeric" value={odometerEndDraft} onChange={(e) => setOdometerEndDraft(e.target.value)} />
              </label>
              <p className="text-xs mb-2" style={{ color: COLORS.inkDim }}>Sign to confirm this log is accurate:</p>
              <SignaturePad onChange={setSignature} savedSignature={localStorage.getItem('savedSignature_' + driver)} />
              <div className="flex gap-2 mt-3">
                <Btn
                  onClick={async () => {
                    if (signature) localStorage.setItem('savedSignature_' + driver, signature);
                    await onEnd(odometerEndDraft, signature);
                    setEndingLog(false); setOdometerEndDraft(''); setSignature(null);
                  }}
                  disabled={!signature}
                >
                  End log
                </Btn>
                <Btn variant="ghost" onClick={() => setEndingLog(false)}>Cancel</Btn>
              </div>
            </div>
          ) : (
            <Btn variant="ghost" onClick={() => setEndingLog(true)} className="w-full">End driver log for the day</Btn>
          )}
        </div>
      )}
    </div>
  );
}

// One-at-a-time accordion for the Admin screen — tapping a section opens it
// and closes whatever was open before, so the screen stays scannable
// instead of one long wall of every setting at once.
// Simple monthly bar chart, plain divs — no charting library needed for
// something this small. Expects { 'YYYY-MM': liters } and shows the last
// six months, oldest to newest.
function MonthlyFuelChart({ monthTotals }) {
  const now = new Date();
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
  }
  const max = Math.max(1, ...months.map((m) => monthTotals[m] || 0));
  return (
    <div className="flex items-end gap-2" style={{ height: 80 }}>
      {months.map((m) => {
        const val = monthTotals[m] || 0;
        const label = new Date(m + '-01').toLocaleDateString('en-US', { month: 'short' });
        return (
          <div key={m} className="flex-1 flex flex-col items-center justify-end h-full">
            <span className="text-xs font-mono mb-1" style={{ color: COLORS.inkDim }}>{val > 0 ? val : ''}</span>
            <div
              className="w-full rounded-t"
              style={{ height: `${Math.max(4, (val / max) * 100)}%`, background: val > 0 ? COLORS.accent : COLORS.line, minHeight: 4 }}
            />
            <span className="text-xs mt-1" style={{ color: COLORS.inkDim }}>{label}</span>
          </div>
        );
      })}
    </div>
  );
}
