              </p>
            ) : (
              <p className="text-sm" style={{ color: COLORS.line }}>{t('pickBothDates')}</p>
            )}
          </div>

          <h2 className="font-display text-lg font-semibold uppercase tracking-wide mb-4">Your recent shifts</h2>
          {myEntries.length === 0 ? (
            <p className="text-sm" style={{ color: COLORS.line }}>No shifts logged yet.</p>
          ) : (
            <div className="space-y-3">
              {myEntries.map((entry) => (
                <TimesheetEntryCard
                  key={entry.id}
                  entry={entry}
                  locked={isWeekApproved(weekStartOf(entry.date))}
                  canEdit={isAdmin || !isWeekApproved(weekStartOf(entry.date))}
                  isEditing={editingEntryId === entry.id}
                  onEdit={() => setEditingEntryId(entry.id)}
                  onCancelEdit={() => setEditingEntryId(null)}
                  onSave={async (patch) => {
                    await updateTimesheetEntry(entry.id, patch);
                    setEditingEntryId(null);
                  }}
                  onDelete={() => deleteTimesheetEntry(entry.id)}
                  onAddJob={addTimesheetJob}
                  onRemoveJob={removeTimesheetJob}
                />
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ---------- TIMESHEETS (admin only) ----------
  if (screen === 'timesheets') {
    if (!isAdmin) {
      return (
        <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8 flex items-center justify-center">
          {FONT_STYLE}
          <div className="text-center">
            <p className="font-display text-lg font-bold mb-4">Admins only</p>
            <Btn onClick={() => setScreen(landingScreenFor(currentMechanic))}>Back to board</Btn>
          </div>
        </div>
      );
    }

    const filtered = timesheets.filter((t) => {
      if (tsFilterMechanic && t.mechanic !== tsFilterMechanic) return false;
      if (tsFilterStart && t.date < tsFilterStart) return false;
      if (tsFilterEnd && t.date > tsFilterEnd) return false;
      return true;
    });

    const totalsByMechanic = {};
    filtered.forEach((e) => {
      totalsByMechanic[e.mechanic] = (totalsByMechanic[e.mechanic] || 0) + entryHours(e);
    });

    // Group shifts by mechanic (each person's shifts together, newest first)
    // instead of interleaving everyone by date.
    const groupedByMechanic = {};
    filtered.forEach((e) => {
      if (!groupedByMechanic[e.mechanic]) groupedByMechanic[e.mechanic] = [];
      groupedByMechanic[e.mechanic].push(e);
    });
    Object.values(groupedByMechanic).forEach((list) => list.sort((a, b) => b.date.localeCompare(a.date)));
    const mechanicGroups = Object.keys(groupedByMechanic).sort((a, b) => a.localeCompare(b));

    const clockedInNow = timesheets.filter((t) => !t.clockOut && t.date === todayStr());

    // Weekly view for the overtime flag + approval workflow
    const baseWeekStart = weekStartOf(todayStr());
    const viewedWeekStart = (() => {
      const d = new Date(baseWeekStart + 'T00:00:00');
      d.setDate(d.getDate() + tsWeekOffset * 7);
      return d.toISOString().slice(0, 10);
    })();
    const viewedWeekEnd = weekEndOf(viewedWeekStart);
    const weekEntries = timesheets.filter((t) => t.date >= viewedWeekStart && t.date <= viewedWeekEnd);
    const weekTotalsByMechanic = {};
    weekEntries.forEach((e) => {
      weekTotalsByMechanic[e.mechanic] = (weekTotalsByMechanic[e.mechanic] || 0) + entryHours(e);
    });
    const weekApproved = isWeekApproved(viewedWeekStart);

    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <OfflineBanner isOnline={isOnline} />
        <div className="max-w-3xl mx-auto">
          <button onClick={() => setScreen(landingScreenFor(currentMechanic))} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>
          <h1 className="font-display text-3xl font-bold mb-8">Timesheets</h1>

          {/* Who's clocked in right now */}
          <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
            <h2 className="font-display text-sm font-bold uppercase tracking-wide mb-3">Clocked in right now</h2>
            {clockedInNow.length === 0 ? (
              <p className="text-sm" style={{ color: COLORS.line }}>Nobody's clocked in at the moment.</p>
            ) : (
              <div className="space-y-2">
                {clockedInNow.map((t) => (
                  <div key={t.id} className="flex items-center justify-between">
                    <span className="font-display font-semibold">🟢 {t.mechanic}</span>
                    <span className="font-mono text-sm" style={{ color: COLORS.inkDim }}>
                      since {fmtTime(t.clockIn)}{t.lunchStart && !t.lunchEnd ? ' (on break)' : ''}
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Weekly totals, overtime flag, and approval */}
          <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
            <div className="flex items-center justify-between mb-4">
              <button onClick={() => setTsWeekOffset(tsWeekOffset - 1)} className="text-lg px-2" style={{ color: COLORS.inkDim }}>←</button>
              <div className="text-center">
                <p className="font-display font-bold">{fmtWeekRange(viewedWeekStart)}</p>
                {weekApproved && (
                  <p className="text-xs font-semibold mt-1" style={{ color: COLORS.done }}>
                    ✓ Approved by {timesheetApprovals[viewedWeekStart].approvedBy}
                  </p>
                )}
              </div>
              <button
                onClick={() => setTsWeekOffset(Math.min(0, tsWeekOffset + 1))}
                disabled={tsWeekOffset >= 0}
                className="text-lg px-2"
                style={{ color: COLORS.inkDim, opacity: tsWeekOffset >= 0 ? 0.3 : 1 }}
              >
                →
              </button>
            </div>

            {Object.keys(weekTotalsByMechanic).length === 0 ? (
              <p className="text-sm text-center mb-4" style={{ color: COLORS.line }}>No shifts this week.</p>
            ) : (
              <div className="space-y-2 mb-4">
                {Object.entries(weekTotalsByMechanic).map(([name, hours]) => (
                  <div key={name} className="flex items-center justify-between py-1">
                    <span className="font-display font-semibold">{name}</span>
                    <span className="font-mono flex items-center gap-2">
                      <span style={{ color: COLORS.ink }}>{fmtHours(hours)}</span>
                    </span>
                  </div>
                ))}
              </div>
            )}

            {weekApproved ? (
              <Btn variant="ghost" onClick={() => unapproveWeek(viewedWeekStart)}>Un-approve this week</Btn>
            ) : (
              <div className="flex gap-2 flex-wrap">
                <Btn onClick={() => approveWeek(viewedWeekStart)} disabled={Object.keys(weekTotalsByMechanic).length === 0}>
                  Approve this week
                </Btn>
                <Btn variant="ghost" onClick={() => setShowWeekTable((s) => !s)} disabled={weekEntries.length === 0}>
                  {showWeekTable ? '✕ Hide table' : '👁️ View here'}
                </Btn>
                <Btn variant="ghost" onClick={() => exportTimesheets(weekEntries, 'week-review')} disabled={weekEntries.length === 0}>
                  📊 Open as spreadsheet
                </Btn>
                <Btn variant="ghost" onClick={() => window.print()} disabled={weekEntries.length === 0}>
                  🖨️ Print
                </Btn>
              </div>
            )}
            {showWeekTable && (
              <React.Fragment>
                <WeekReviewTable entries={weekEntries} />
                <PrintPortal>
                  <WeekReviewTable entries={weekEntries} printMode />
                </PrintPortal>
              </React.Fragment>
            )}
            <p className="text-xs mt-3 no-print" style={{ color: COLORS.line }}>
              Approving a week locks it — mechanics can no longer edit shifts within it themselves.
            </p>
          </div>

          {/* Email settings */}
          <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
            <h2 className="font-display text-sm font-bold uppercase tracking-wide mb-4">Automatic reports</h2>

            <EmailListEditor
              label="Weekly timesheet — sends every Monday"
              helper="Anyone who should get the weekly timesheet CSV (comma-separated for more than one)"
              value={(timesheetSettings.weeklyEmails || []).join(', ')}
              onSave={(list) => saveTimesheetSettings({ ...timesheetSettings, weeklyEmails: list })}
            />

            <EmailListEditor
              label="Weekly backup — sends every Monday"
              helper="Anyone who should get the full app backup file (usually just you)"
              value={(timesheetSettings.backupEmails || []).join(', ')}
              onSave={(list) => saveTimesheetSettings({ ...timesheetSettings, backupEmails: list })}
            />

            <EmailListEditor
              label="Monthly hours summary — sends the 1st of each month"
              helper="One email for whoever handles payroll/books — a simple total-hours-per-person report for last month"
              value={(timesheetSettings.monthlyEmail || '')}
              single
              onSave={(list) => saveTimesheetSettings({ ...timesheetSettings, monthlyEmail: list[0] || '' })}
            />

            <label className="flex items-center justify-between gap-3 cursor-pointer mt-2">
              <div>
                <span className="text-sm font-semibold block" style={{ color: COLORS.ink }}>Weekly emails turned on</span>
                <span className="text-xs" style={{ color: COLORS.line }}>Turn off to pause the weekly timesheet and backup emails without deleting the addresses above. The monthly summary isn't affected by this.</span>
              </div>
              <input
                type="checkbox"
                checked={!!timesheetSettings.autoEmail}
                onChange={(e) => saveTimesheetSettings({ ...timesheetSettings, autoEmail: e.target.checked })}
                className="w-5 h-5 flex-shrink-0"
                style={{ accentColor: COLORS.accent }}
              />
            </label>
          </div>

          {/* Add a missed day (any employee) */}
          {showAddMissedDayAdmin ? (
            <AddMissedDayForm
              t={t}
              mechanics={mechanics}
              onSubmit={async (mechanicName, date, ci, co, ls, le, setError) => {
                await addManualEntry(mechanicName, date, ci, co, ls, le);
                setShowAddMissedDayAdmin(false);
              }}
              onCancel={() => setShowAddMissedDayAdmin(false)}
            />
          ) : (
            <button
              onClick={() => setShowAddMissedDayAdmin(true)}
              className="w-full text-center text-sm font-display uppercase tracking-wide mb-6 py-3 rounded-lg"
              style={{ color: COLORS.accent, background: COLORS.surface, border: `2px dashed ${COLORS.accent}` }}
            >
              + Add a missed day for someone
            </button>
          )}

          {/* Filters */}
          <div className="rounded-lg p-5 mb-6" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
            <select
              value={tsFilterMechanic}
              onChange={(e) => setTsFilterMechanic(e.target.value)}
              className="w-full rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2"
              style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
            >
              <option value="">Everyone</option>
              {mechanics.map((m) => <option key={m} value={m}>{m}</option>)}
            </select>
            {tsFilterMechanic && (
              <div className="grid grid-cols-2 gap-3 mt-3">
                <label className="block">
                  <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>From</span>
                  <input
                    type="date"
                    value={tsFilterStart}
                    onChange={(e) => setTsFilterStart(e.target.value)}
                    className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                    style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                  />
                </label>
                <label className="block">
                  <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>To</span>
                  <input
                    type="date"
                    value={tsFilterEnd}
                    onChange={(e) => setTsFilterEnd(e.target.value)}
                    className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                    style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                  />
                </label>
              </div>
            )}
          </div>

          <div className="flex items-center justify-between mb-4">
            <h2 className="font-display text-lg font-semibold uppercase tracking-wide">Totals</h2>
            <Btn variant="ghost" onClick={() => exportTimesheets(filtered)}>📤 Export & Share</Btn>
          </div>

          {Object.keys(totalsByMechanic).length === 0 ? (
            <p className="text-sm mb-8" style={{ color: COLORS.line }}>No shifts in this range.</p>
          ) : (
            <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
              {Object.entries(totalsByMechanic).map(([name, hours]) => (
                <div key={name} className="flex items-center justify-between py-2" style={{ borderBottom: `1px solid ${COLORS.line}` }}>
                  <span className="font-display font-semibold">{name}</span>
                  <span className="font-mono">{fmtHours(hours)}</span>
                </div>
              ))}
            </div>
          )}

          {tsFilterMechanic && (
          <React.Fragment>
          <h2 className="font-display text-lg font-semibold uppercase tracking-wide mb-4">All shifts</h2>
          <p className="text-xs mb-4" style={{ color: COLORS.line }}>As an admin, you can edit or delete anyone's shift here — including in approved weeks.</p>
          {filtered.length === 0 ? (
            <p className="text-sm" style={{ color: COLORS.line }}>Nothing to show yet.</p>
          ) : (
            <div className="space-y-6">
              {mechanicGroups.map((name) => (
                <div key={name}>
                  <p
                    className="font-display text-xs uppercase tracking-wide mb-2 pb-2 flex items-center justify-between"
                    style={{ color: COLORS.accent, borderBottom: `1px solid ${COLORS.line}` }}
                  >
                    <span>{name}</span>
                    <span>{fmtHours(totalsByMechanic[name] || 0)} total</span>
                  </p>
                  <div className="space-y-3">
                    {groupedByMechanic[name].map((entry) => (
                      <TimesheetEntryCard
                        key={entry.id}
                        entry={entry}
                        locked={false}
                        canEdit={true}
                        isEditing={editingEntryId === entry.id}
                        onEdit={() => setEditingEntryId(entry.id)}
                        onCancelEdit={() => setEditingEntryId(null)}
                        onSave={async (patch) => {
                          await updateTimesheetEntry(entry.id, patch);
                          setEditingEntryId(null);
                        }}
                        onDelete={() => deleteTimesheetEntry(entry.id)}
                        onAddJob={addTimesheetJob}
                        onRemoveJob={removeTimesheetJob}
                      />
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
          </React.Fragment>
          )}
        </div>
      </div>
    );
  }

  // ---------- TEAM (admin only) ----------
  if (screen === 'timesheets' || screen === 'team') {
    setScreen('admin');
    return null;
  }

  // ---------- ADMIN (consolidated: team, payroll, production, billing) ----------
  if (screen === 'admin') {
    if (!isAdmin && !isForeman) {
      return (
        <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8 flex items-center justify-center">
          {FONT_STYLE}
          <div className="text-center">
            <p className="font-display text-lg font-bold mb-4">Admins only</p>
            <Btn onClick={() => setScreen(landingScreenFor(currentMechanic))}>Back to board</Btn>
          </div>
        </div>
      );
    }

    const filtered = timesheets.filter((t) => {
      if (tsFilterMechanic && t.mechanic !== tsFilterMechanic) return false;
      if (tsFilterStart && t.date < tsFilterStart) return false;
      if (tsFilterEnd && t.date > tsFilterEnd) return false;
      return true;
    });
    const filteredProduction = productionShifts.filter((s) => {
      if (!s.end) return false;
      const d = s.end.slice(0, 10);
      if (tsFilterMechanic && s.employee !== tsFilterMechanic) return false;
      if (tsFilterStart && d < tsFilterStart) return false;
      if (tsFilterEnd && d > tsFilterEnd) return false;
      return true;
    });
    const totalsByMechanic = {};
    filtered.forEach((e) => { totalsByMechanic[e.mechanic] = (totalsByMechanic[e.mechanic] || 0) + entryHours(e); });
    const groupedByMechanic = {};
    filtered.forEach((e) => {
      if (!groupedByMechanic[e.mechanic]) groupedByMechanic[e.mechanic] = [];
      groupedByMechanic[e.mechanic].push(e);
    });
    Object.values(groupedByMechanic).forEach((list) => list.sort((a, b) => b.date.localeCompare(a.date)));
    const mechanicGroups = Object.keys(groupedByMechanic).sort((a, b) => a.localeCompare(b));
    const clockedInNow = timesheets.filter((t) => !t.clockOut && t.date === todayStr());

    const baseWeekStart = weekStartOf(todayStr());
    const viewedWeekStart = (() => {
      const d = new Date(baseWeekStart + 'T00:00:00');
      d.setDate(d.getDate() + tsWeekOffset * 7);
      return d.toISOString().slice(0, 10);
    })();
    const viewedWeekEnd = weekEndOf(viewedWeekStart);
    const weekEntries = timesheets.filter((t) => t.date >= viewedWeekStart && t.date <= viewedWeekEnd);
    const weekTotalsByMechanic = {};
    weekEntries.forEach((e) => { weekTotalsByMechanic[e.mechanic] = (weekTotalsByMechanic[e.mechanic] || 0) + entryHours(e); });
    const weekApproved = isWeekApproved(viewedWeekStart);

    const productionClockedInNow = productionShifts.filter((s) => !s.end);
    const recentProductionShifts = productionShifts.filter((s) => s.end).sort((a, b) => b.end.localeCompare(a.end)).slice(0, 20);

    // Combined weekly breakdown for Timesheets — everyone, grouped by job
    // the same way the Employees picker is, with hours plus whatever
    // production number fits their actual machine. Extra/billable hours are
    // tracked separately and never folded into the hours total, since
    // they're for billing only. Fuel deliveries don't show a "production"
    // number here at all — that's what the Fuel Log section is for.
    const weekProductionShifts = productionShifts.filter((s) => s.end && s.end.slice(0, 10) >= viewedWeekStart && s.end.slice(0, 10) <= viewedWeekEnd);
    const productionWeekByPerson = {};
    weekProductionShifts.forEach((s) => {
      if (!productionWeekByPerson[s.employee]) {
        productionWeekByPerson[s.employee] = { hours: 0, extraHours: 0, trees: 0, spruce: 0, aspen: 0, loadCount: 0, topPileCount: 0 };
      }
      const p = productionWeekByPerson[s.employee];
      p.hours += (new Date(s.end) - new Date(s.start)) / 1000 / 60 / 60;
      p.extraHours += (s.extraTasks || []).reduce((sum, t) => sum + (parseFloat(t.hours) || 0), 0);
      p.trees += parseFloat(s.trees) || 0;
      p.spruce += parseFloat(s.spruce) || 0;
      p.aspen += parseFloat(s.aspen) || 0;
      p.loadCount += parseFloat(s.loadCount) || 0;
      p.topPileCount += parseFloat(s.topPileCount) || 0;
    });
    const weekGroups = groupedEmployees().map((group) => ({
      ...group,
      names: group.names.filter((n) => (group.label === 'Mechanics' ? weekTotalsByMechanic[n] !== undefined : productionWeekByPerson[n])),
    })).filter((group) => group.names.length > 0);
    // Safety net: a name might have real hours this week but not exactly
    // match anyone in the current roster (a rename, a spelling difference,
    // anything) — that must never mean the data silently vanishes from
    // view. Catch anything not already shown above and surface it plainly.
    const namesAlreadyShown = new Set(weekGroups.flatMap((g) => g.names));
    const orphanedMechanicNames = Object.keys(weekTotalsByMechanic).filter((n) => !namesAlreadyShown.has(n));
    const orphanedProductionNames = Object.keys(productionWeekByPerson).filter((n) => !namesAlreadyShown.has(n));
    if (orphanedMechanicNames.length > 0 || orphanedProductionNames.length > 0) {
      weekGroups.push({ label: "Needs attention — name doesn't match current roster", names: [...orphanedMechanicNames, ...orphanedProductionNames] });
    }

    // Fuel Log — a completely separate concern from Timesheets/payroll,
    // purely informational tracking of who delivered how much fuel to which
    // unit and when.
    const fuelDeliveries = [];
    productionShifts.forEach((s) => {
      if (machineType(s.machine, unitTypes) !== 'fuel' || !s.fuelLog) return;
      Object.entries(s.fuelLog).forEach(([receivingUnit, amounts]) => {
        const liters = (amounts || []).reduce((sum, v) => sum + (parseFloat(v) || 0), 0);
        if (liters > 0) {
          fuelDeliveries.push({ date: (s.end || s.start || '').slice(0, 10), truck: s.machine, receivingUnit, liters });
        }
      });
    });
    const fuelByUnit = {};
    fuelDeliveries.forEach((d) => {
      if (!fuelByUnit[d.receivingUnit]) fuelByUnit[d.receivingUnit] = { total: 0, monthly: {} };
      fuelByUnit[d.receivingUnit].total += d.liters;
      const month = d.date.slice(0, 7);
      fuelByUnit[d.receivingUnit].monthly[month] = (fuelByUnit[d.receivingUnit].monthly[month] || 0) + d.liters;
    });
    const fuelGroups = [];

          <PushMessageEditor pushMessages={pushMessages} onSave={savePushMessages} />
          </AdminSection>
          )}
        </div>
      </div>

  // ---------- TEAM SHOUTOUTS ----------
  if (screen === 'shoutouts') {

    });

    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <OfflineBanner isOnline={isOnline} />
        <div className="max-w-2xl mx-auto">
          <button onClick={() => setScreen(landingScreenFor(currentMechanic))} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>

      </div>

  // ---------- MAPS ----------
  if (screen === 'maps') {
    const publicMaps = maps.filter((m) => m.isPublic);

    const currentMap = (selectedMapId && publicMaps.find((m) => m.id === selectedMapId)) || defaultMap;

    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <div className="max-w-lg mx-auto">
          <button onClick={() => setScreen(landingScreenFor(currentMechanic))} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>
          <div className="flex items-center justify-between mb-6">
            <h1 className="font-display text-3xl font-bold">🗺️ Maps</h1>
            {(isAdmin || isForeman) && (

                <p className="text-xs" style={{ color: COLORS.inkDim }}>Ask an admin to add one.</p>

            <React.Fragment>
              {publicMaps.length > 1 && (
                <select
                  value={currentMap ? currentMap.id : ''}
                  onChange={(e) => setSelectedMapId(e.target.value)}
                  className="w-full rounded-lg px-4 py-2.5 text-base mb-4 focus:outline-none focus:ring-2"
                  style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                >

                </select>

              <div className="flex items-center justify-between mb-2">
                <p className="text-xs" style={{ color: COLORS.inkDim }}>{currentMap.name} — placeholder terrain until a real map is uploaded</p>
                <button

                  className="text-xs font-semibold px-3 py-1.5 rounded-lg"

        </div>

        {showManageMaps && (isAdmin || isForeman) && (
          <ManageMapsOverlay

            onTogglePublic={setMapPublic}

        {pendingPinPosition && currentMap && (

        {viewingPinId && (() => {

            <MapPinDetail

              canTogglePublic={isAdmin || isForeman}

  // ---------- CHECKLIST TEMPLATES ----------
  if (screen === 'settings') {

          <button onClick={() => setScreen(landingScreenFor(currentMechanic))} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>

          <h1 className="font-display text-3xl font-bold mb-8">Settings</h1>

                <span className="text-sm font-semibold block" style={{ color: COLORS.ink }}>🔔 Shift reminders</span>

              </div>
              <input
                type="checkbox"
                checked={pushEnabled}

                  if (e.target.checked) {

          {isAdmin && (

              <EmailListEditor

              />
              <EmailListEditor
                label="Monthly hours summary — sends the 1st of each month"
                helper="One email for whoever handles payroll/books — a simple total-hours-per-person report for last month"
                value={(timesheetSettings.monthlyEmail || '')}

                onSave={(list) => saveTimesheetSettings({ ...timesheetSettings, monthlyEmail: list[0] || '' })}
              />
              <label className="flex items-center justify-between gap-3 cursor-pointer mt-2">
                <div>
                  <span className="text-sm font-semibold block" style={{ color: COLORS.ink }}>Weekly emails turned on</span>
                  <span className="text-xs" style={{ color: COLORS.inkDim }}>Turn off to pause the weekly timesheet and backup emails without deleting the addresses above. The monthly summary isn't affected by this.</span>
                </div>
                <input
                  type="checkbox"
                  checked={!!timesheetSettings.autoEmail}
                  onChange={(e) => saveTimesheetSettings({ ...timesheetSettings, autoEmail: e.target.checked })}
                  className="w-5 h-5 flex-shrink-0"
                  style={{ accentColor: COLORS.accent }}
                />
              </label>
            </div>
          )}

          <div className="rounded-lg p-5 mt-4 space-y-1" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
            <button

              style={{ color: COLORS.ink, background: COLORS.surfaceRaised }}

            <button

              style={{ color: COLORS.ink, background: COLORS.surfaceRaised }}
            >
              <span style={{ fontSize: '1.1rem' }}>🔓</span>
              {!!localStorage.getItem('webauthn_cred_' + currentMechanic) ? 'Turn off Face/Touch ID' : 'Enable Face/Touch ID'}
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (screen === 'pdtTranslations') {
    if (!isAdmin) {
      return (
        <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8 flex items-center justify-center">
          <div className="text-center">
            <p className="text-lg mb-4">Admins only.</p>
            <button onClick={() => setScreen(landingScreenFor(currentMechanic))} className="font-display text-sm underline" style={{ color: COLORS.accent }}>{t('backToBoard')}</button>
          </div>
        </div>
      );
    }
    return (
      <PdtTranslationsScreen
        customPdtStrings={customPdtStrings}
        customPdtJokes={customPdtJokes}
        onSaveStrings={persistCustomPdtStrings}
        onSaveJokes={persistCustomPdtJokes}
        onBack={() => setScreen(landingScreenFor(currentMechanic))}
        t={t}
      />
    );
  }

  if (screen === 'checklists') {
    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <FireworksOverlay show={showFireworks} />
        <OfflineBanner isOnline={isOnline} />
        <PinModalOverlay
          pinModal={pinModal}
          pinInput={pinInput}
          setPinInput={setPinInput}
          pinError={pinError}
          onSubmit={submitPin}
          onCancel={cancelPinModal}
          onForgot={forgotPin}
          t={t}
        />
        <EmailPromptOverlay
          show={showEmailPrompt}
          onSave={async (email) => {

          onSkip={() => setShowEmailPrompt(false)}
        />
        <PushPromptOverlay
          show={showPushPrompt}
          mechanic={currentMechanic}
          onEnable={async () => {

            setShowPushPrompt(false);
          }}
          onSkip={() => setShowPushPrompt(false)}
        />
        <BiometricOfferOverlay
          mechanic={offerBiometric}
          onEnable={async () => {

            try {

            }

          onSkip={() => setOfferBiometric(null)}
        />
        <div className="max-w-3xl mx-auto">
          <button onClick={() => setScreen(landingScreenFor(currentMechanic))} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>
          <div className="flex items-center justify-between mb-8">
            <h1 className="font-display text-3xl font-bold">{t('checklists')}</h1>
            <Btn onClick={() => setShowNewTemplate((s) => !s)}>{t('newChecklist')}</Btn>
          </div>

          {showNewTemplate && (
            <NewTemplateForm onCancel={() => setShowNewTemplate(false)} onSubmit={addTemplate} t={t} />

          {templates.length === 0 ? (
            <div className="rounded-lg p-10 text-center" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>

              <p className="text-sm" style={{ color: COLORS.line }}>{t('tapNewChecklistHelper')}</p>
            </div>
          ) : (
            <div className="space-y-4">
              {templates.map((tpl) => {
                const isDefault = ['buncher-b4', 'excavator-ex1', 'crawler', 'processor', 'skidder'].includes(tpl.id);
                if (editingTemplateId === tpl.id) {
                  return (
                    <NewTemplateForm
                      key={tpl.id}
                      isEdit
                      initialName={tpl.name}
                      initialItemsText={tpl.items.join('\n')}
                      onCancel={() => setEditingTemplateId(null)}
                      onSubmit={(name, itemsText) => updateTemplate(tpl.id, name, itemsText)}
                      t={t}
                    />
                  );

                return (
                  <div key={tpl.id} className="rounded-lg p-5" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>

                        <p className="text-sm" style={{ color: COLORS.line }}>{tpl.items.length} {t('steps')}</p>

                    {pdtEditingTemplateId === tpl.id && (
                      <PdtChecklistForm
                        name={tpl.name}
                        items={tpl.items}
                        nameTranslations={tpl.nameTranslations}
                        itemTranslations={tpl.itemTranslations}
                        onSave={async (namePdt, itemPdts) => {
                          await updateTemplatePdt(tpl.id, namePdt, itemPdts);
                          setPdtEditingTemplateId(null);
                        }}
                        onCancel={() => setPdtEditingTemplateId(null)}
                      />
                    )}
                    <p className="text-sm mb-3" style={{ color: COLORS.inkDim }}>
                      {tpl.items.slice(0, 3).map((it, idx) => getLocalizedChecklistText(it, tpl.nameOrigLang, tpl.itemTranslations, lang, idx)).join(' • ')}
                      {tpl.items.length > 3 ? ' • …' : ''}
                    </p>
                    {confirmDeleteTemplate === tpl.id && !isDefault && (
                      <div className="mt-3 pt-3 border-t" style={{ borderColor: COLORS.line }}>

                        <Btn variant="danger" onClick={() => deleteTemplate(tpl.id)}>{t('yesDeleteChecklist')}</Btn>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ---------- UNIT VIEW ----------
  if (screen === 'unit') {
    const unitOrders = orders.filter((o) => o.unit === activeUnit).sort((a, b) => (a.status === 'Done') - (b.status === 'Done'));
    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <FireworksOverlay show={showFireworks} />
        <OfflineBanner isOnline={isOnline} />
        <PinModalOverlay
          pinModal={pinModal}
          pinInput={pinInput}
          setPinInput={setPinInput}
          pinError={pinError}
          onSubmit={submitPin}
          onCancel={cancelPinModal}
          onForgot={forgotPin}
          t={t}
        />
        <EmailPromptOverlay
          show={showEmailPrompt}
          onSave={async (email) => {
            await saveMechanicEmail(currentMechanic, email);
            setShowEmailPrompt(false);
          }}
          onSkip={() => setShowEmailPrompt(false)}
        />
        <PushPromptOverlay
          show={showPushPrompt}
          mechanic={currentMechanic}
          onEnable={async () => {
            await registerPushNotifications(currentMechanic);
            setShowPushPrompt(false);
          }}
          onSkip={() => setShowPushPrompt(false)}
        />
        <BiometricOfferOverlay
          mechanic={offerBiometric}
          onEnable={async () => {
            const name = offerBiometric;
            setOfferBiometric(null);
            try {
              await registerBiometric(name);
            } catch (e) {
              // ignore — user can enable it later from the board
            }
          }}
          onSkip={() => setOfferBiometric(null)}
        />

          </button>
          <div className="flex items-center justify-between mb-8">

            <Btn onClick={() => setShowAddOrder((s) => !s)}>{t('newWorkOrder')}</Btn>
          </div>

          {showAddOrder && (
            <NewOrderForm
              mechanics={mechanics}
              units={units}
              lockUnit={activeUnit}
              onCancel={() => setShowAddOrder(false)}
              onSubmit={createOrder}
              t={t}
            />
          )}

          {unitOrders.length === 0 ? (
            <div className="rounded-lg p-10 text-center mt-6" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>
              <p className="text-base mb-2" style={{ color: COLORS.inkDim }}>{t('allCaughtUp')}</p>
              <p className="text-sm" style={{ color: COLORS.line }}>{t('noOrdersYetTapCreate')}</p>
            </div>
          ) : (
            <div className="mt-6 space-y-3">
              {unitOrders.map((o) => {
                const isDone = o.status === 'Done';
                return (
                  <button
                    key={o.id}
                    onClick={() => { setActiveOrderId(o.id); setScreen('order'); setConfirmDelete(false); }}
                    style={{ background: isDone ? COLORS.line : COLORS.manila, color: isDone ? COLORS.inkDim : COLORS.ink2 }}
                    className="relative rounded-lg p-5 pl-8 text-left w-full focus:outline-none focus:ring-2 transition-all hover:scale-102 active:scale-98"
                  >
                    <PunchHole bg={isDone ? COLORS.line : COLORS.manila} />
                    <div className="flex items-start justify-between gap-3">
                      <div className="flex-1 min-w-0">
                        <p className="font-body font-semibold text-base leading-snug mb-2">{getLocalizedText(o.description, lang) || t('noDescription')}</p>
                        <div className="flex flex-wrap items-center gap-4 font-mono text-xs" style={{ color: isDone ? COLORS.line : '#5B5342', opacity: isDone ? 0.6 : 1 }}>
                          {getAssignedMechanics(o).length > 0 && <span>👤 {getAssignedMechanics(o).join(', ')}</span>}
                          {o.hours && o.hours !== '' && <span>⏱️ {o.hours}h</span>}
                          {o.dueDate && <span>📅 {fmtDate(o.dueDate)}</span>}

                        {o.checklist && (
                          <div className="mt-2 text-xs font-semibold" style={{ color: isDone ? COLORS.line : COLORS.accent }}>

                          </div>
                        )}
                      </div>
                      <StatusStamp status={o.status} small t={t} />
                    </div>
                  </button>

function WeekReviewTable({ entries, printMode }) {
  const sorted = [...entries].sort((a, b) => (a.mechanic || '').localeCompare(b.mechanic || '') || a.date.localeCompare(b.date));
  const groups = [];
  sorted.forEach((e) => {
    const last = groups[groups.length - 1];
    if (last && last.mechanic === e.mechanic) {
      last.entries.push(e);
    } else {
      groups.push({ mechanic: e.mechanic, entries: [e] });
    }
  });

  // On screen this uses the app's dark palette (COLORS.*) same as always.
  // In printMode it swaps to plain dark-on-white — the dark theme's near-
  // white text on a dark background would print as barely-visible pale
  // gray on paper (or waste ink filling the whole background), so paper
  // output gets its own light palette instead of reusing COLORS.
  const pal = printMode
    ? { bg: '#fff', line: '#ccc', ink: '#1B1F19', inkDim: '#555', accent: '#1B1F19', done: '#1B1F19', surface: '#f2f2f2' }
    : { bg: COLORS.surfaceRaised, line: COLORS.line, ink: COLORS.ink, inkDim: COLORS.inkDim, accent: COLORS.accent, done: COLORS.done, surface: COLORS.surface };

  const th = { padding: '8px 12px', textAlign: 'left', fontWeight: 600, whiteSpace: 'nowrap', borderBottom: `2px solid ${pal.line}` };
  const td = { padding: '8px 12px', whiteSpace: 'nowrap', borderBottom: `1px solid ${pal.line}` };

  return (
    <div className="mt-4 rounded-lg overflow-x-auto" style={{ background: pal.bg, border: `1px solid ${pal.line}` }}>
      <table className="text-xs font-mono w-full" style={{ borderCollapse: 'collapse' }}>
        <thead>
          <tr style={{ color: pal.inkDim }}>
            <th style={th}>Date</th>
            <th style={th}>In</th>
            <th style={th}>Out</th>
            <th style={th}>Break</th>
            <th style={th}>Worked thru break</th>
            <th style={th}>Paid hrs</th>
            <th style={th}>Signed</th>
            <th style={th}>Jobs</th>
          </tr>
        </thead>
        <tbody>
          {groups.map((g) => (
            <React.Fragment key={g.mechanic}>
              <tr>
                <td colSpan={8} style={{ padding: '8px 12px', fontWeight: 700, color: pal.accent, background: pal.surface, borderBottom: `1px solid ${pal.line}` }}>
                  {g.mechanic}
                </td>
              </tr>
              {g.entries.map((e) => (
                <tr key={e.id} style={{ color: pal.ink }}>
                  <td style={td}>{fmtDate(e.date)}</td>
                  <td style={td}>{fmtTime(e.clockIn)}</td>
                  <td style={td}>{e.clockOut ? fmtTime(e.clockOut) : '—'}</td>
                  <td style={td}>{!e.skippedLunch && e.lunchStart && e.lunchEnd ? `${fmtTime(e.lunchStart)}–${fmtTime(e.lunchEnd)}` : '—'}</td>
                  <td style={td}>{e.skippedLunch ? 'Yes' : 'No'}</td>
                  <td style={{ ...td, color: pal.accent, fontWeight: 700 }}>{fmtHoursDecimal(entryHours(e))}</td>
                  <td style={{ ...td, color: e.signature ? pal.done : pal.line }}>{e.signature ? '✓' : '—'}</td>
                  <td style={td}>{(e.jobs || []).map((j) => `${j.unit}: ${j.hours}h`).join(' | ') || '—'}</td>
                </tr>
              ))}
            </React.Fragment>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function TimesheetEntryCard({ entry, locked, canEdit, isEditing, onEdit, onCancelEdit, onSave, onDelete, onAddJob, onRemoveJob }) {
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [showSignature, setShowSignature] = useState(false);
  // Clock in/out — like breaks, these are time-only inputs now. Each keeps
  // its OWN original calendar day locked in place behind the scenes (so a
  // shift that genuinely crosses midnight still works correctly), removing
  // the same "picked the wrong date by accident" risk that caused a real
  // mis-entry with break times earlier.
  const getLocalDatePart = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  };
  const toLocalTime = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const combineDateTime = (datePart, time) => {
    if (!time || !datePart) return null;
    return new Date(`${datePart}T${time}`).toISOString();
  };
  const clockInDatePart = getLocalDatePart(entry.clockIn) || entry.date;
  const clockOutDatePart = getLocalDatePart(entry.clockOut) || clockInDatePart;
  const [clockInTime, setClockInTime] = useState(toLocalTime(entry.clockIn));
  const [clockOutTime, setClockOutTime] = useState(toLocalTime(entry.clockOut));
  const [lunchStartTime, setLunchStartTime] = useState(toLocalTime(entry.lunchStart));
  const [lunchEndTime, setLunchEndTime] = useState(toLocalTime(entry.lunchEnd));

  if (isEditing) {
    return (
      <div className="rounded-lg p-5" style={{ background: COLORS.surface, border: `2px solid ${COLORS.accent}` }}>
        <p className="font-display font-semibold mb-4">{fmtDate(entry.date)}</p>
        <div className="grid grid-cols-2 gap-3 mb-3">
          <label className="block">
            <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Clock in</span>
            <input type="time" value={clockInTime} onChange={(e) => setClockInTime(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2" style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }} />
          </label>
          <label className="block">
            <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Clock out</span>
            <input type="time" value={clockOutTime} onChange={(e) => setClockOutTime(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2" style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }} />
          </label>
          <label className="block">
            <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Break start</span>
            <input type="time" value={lunchStartTime} onChange={(e) => setLunchStartTime(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2" style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }} />
          </label>
          <label className="block">
            <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Break end</span>
            <input type="time" value={lunchEndTime} onChange={(e) => setLunchEndTime(e.target.value)} className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2" style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }} />
          </label>
        </div>
        <TimesheetJobsEditor entry={entry} onAdd={onAddJob} onRemove={onRemoveJob} />
        {confirmDelete ? (
          <div className="mt-4 rounded-lg p-3" style={{ background: COLORS.surfaceRaised }}>
            <p className="text-sm mb-3" style={{ color: COLORS.inkDim }}>Delete this whole shift? This can't be undone.</p>
            <div className="flex gap-2">
              <Btn variant="danger" onClick={onDelete}>Yes, delete it</Btn>
              <Btn variant="ghost" onClick={() => setConfirmDelete(false)}>Cancel</Btn>
            </div>
          </div>
        ) : (
          <div className="flex gap-2 mt-4">
            <Btn
              onClick={() =>
                onSave({
                  clockIn: combineDateTime(clockInDatePart, clockInTime),
                  clockOut: combineDateTime(clockOutDatePart, clockOutTime),
                  lunchStart: combineDateTime(clockInDatePart, lunchStartTime),
                  lunchEnd: combineDateTime(clockInDatePart, lunchEndTime),
                })
              }
            >
              Save changes
            </Btn>
            <Btn variant="ghost" onClick={onCancelEdit}>Cancel</Btn>
            <button onClick={() => setConfirmDelete(true)} className="text-xs underline ml-auto" style={{ color: '#E07A5F' }}>
              Delete shift
            </button>
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="rounded-lg p-4" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
      <div className="flex items-center justify-between mb-2">
        <span className="font-display font-semibold">{fmtDate(entry.date)}</span>
        {!canEdit ? (
          <span className="text-xs" style={{ color: COLORS.line }}>Ask admin to fix a mistake</span>
        ) : locked ? (
          <span className="text-xs font-semibold" style={{ color: COLORS.done }}>🔒 Approved</span>
        ) : (
          <button onClick={onEdit} className="text-xs underline" style={{ color: COLORS.accent }}>Edit</button>
        )}
      </div>
      <div className="flex flex-wrap gap-4 text-xs font-mono mb-1" style={{ color: COLORS.inkDim }}>
        <span>In {fmtTime(entry.clockIn)}</span>
        <span>Out {entry.clockOut ? fmtTime(entry.clockOut) : '—'}</span>
        {!entry.skippedLunch && entry.lunchStart && entry.lunchEnd && <span>Break {fmtTime(entry.lunchStart)}–{fmtTime(entry.lunchEnd)}</span>}
        {entry.skippedLunch && <span>No break taken</span>}
      </div>
      {entry.clockOut && (
        <p className="text-xs font-mono mb-2" style={{ color: COLORS.accent }}>
          Total for the day: <span className="font-bold">{fmtHours(entryHours(entry))}</span>
        </p>
      )}
      {(entry.jobs || []).length > 0 && (
        <p className="text-xs" style={{ color: COLORS.line }}>
          {entry.jobs.map((j) => `${j.unit} (${j.hours}h)`).join(' • ')}
        </p>
      )}
      {entry.signature && (
        <div className="mt-2">
          <button
            onClick={() => setShowSignature((s) => !s)}
            className="text-xs underline"
            style={{ color: COLORS.done }}
          >
            ✓ Signed {showSignature ? '(hide)' : '(view)'}
          </button>
          {showSignature && (
            <div className="mt-2 rounded-lg p-2 inline-block" style={{ background: '#fff' }}>
              <img src={entry.signature} alt="Signature" style={{ height: 60, display: 'block' }} />
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function PdtTranslationsScreen({ customPdtStrings, customPdtJokes, onSaveStrings, onSaveJokes, onBack, t }) {
  const [search, setSearch] = useState('');
  const [drafts, setDrafts] = useState(customPdtStrings);
  const [jokeDrafts, setJokeDrafts] = useState(customPdtJokes.length ? customPdtJokes : ['']);
  const [saving, setSaving] = useState(false);

  const keys = Object.keys(translations.en).sort();
  const q = search.trim().toLowerCase();
  const filteredKeys = q
    ? keys.filter((k) => translations.en[k].toLowerCase().includes(q) || k.toLowerCase().includes(q))
    : keys;

  const handleSaveStrings = async () => {
    setSaving(true);
    try {
      const cleaned = {};
      Object.entries(drafts).forEach(([k, v]) => { if (v && v.trim()) cleaned[k] = v.trim(); });
      await onSaveStrings(cleaned);
    } finally {
      setSaving(false);
    }
  };

  const handleSaveJokes = async () => {
    setSaving(true);
    try {
      const cleaned = jokeDrafts.map((j) => j.trim()).filter(Boolean);
      await onSaveJokes(cleaned);
    } finally {
      setSaving(false);
    }
  };

  return (
    <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
      <div className="max-w-3xl mx-auto">
        <button onClick={onBack} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
          {t('backToBoard')}
        </button>
        <h1 className="font-display text-3xl font-bold mb-2">Plautdietsch Translations</h1>
        <p className="text-sm mb-6" style={{ color: COLORS.inkDim }}>
          Fix or add Plautdietsch wording for any button, label, or joke in the app. Leave a box blank to keep using the built-in default.
        </p>

        <input
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder="Search by the English text..."
          className="w-full rounded-lg px-4 py-2.5 text-base mb-6 focus:outline-none focus:ring-2"
          style={{ background: COLORS.surface, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
        />

        <div className="rounded-lg p-5 mb-6" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
          <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
            <h2 className="font-display text-sm font-bold uppercase tracking-wide">Buttons & Labels ({filteredKeys.length})</h2>
            <Btn onClick={handleSaveStrings} disabled={saving}>{saving ? 'Saving…' : 'Save all'}</Btn>
          </div>
          <div className="space-y-4" style={{ maxHeight: '60vh', overflowY: 'auto' }}>
            {filteredKeys.map((k) => (
              <div key={k}>
                <span className="text-xs block mb-1" style={{ color: COLORS.line }}>{translations.en[k]}</span>
                <input
                  value={drafts[k] || ''}
                  onChange={(e) => setDrafts({ ...drafts, [k]: e.target.value })}
                  placeholder={translations.pdt[k] || translations.en[k]}
                  className="w-full rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2"
                  style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                />
              </div>
            ))}
            {filteredKeys.length === 0 && (
              <p className="text-sm" style={{ color: COLORS.line }}>No matches for that search.</p>
            )}
          </div>
        </div>

        <div className="rounded-lg p-5" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
          <div className="flex items-center justify-between mb-4">
            <h2 className="font-display text-sm font-bold uppercase tracking-wide">Jokes</h2>
            <Btn onClick={handleSaveJokes} disabled={saving}>{saving ? 'Saving…' : 'Save jokes'}</Btn>
          </div>
          <div className="space-y-3">
            {jokeDrafts.map((j, i) => (
              <div key={i} className="flex gap-2">
                <input
                  value={j}
                  onChange={(e) => {
                    const next = [...jokeDrafts];
                    next[i] = e.target.value;
                    setJokeDrafts(next);
                  }}
                  placeholder="Type a joke in Plautdietsch..."
                  className="flex-1 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2"
                  style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                />
                <button
                  onClick={() => setJokeDrafts(jokeDrafts.filter((_, idx) => idx !== i))}
                  className="px-2 text-sm"
                  style={{ color: '#E07A5F' }}
                >
                  ✕
                </button>
              </div>
            ))}
            <button
              onClick={() => setJokeDrafts([...jokeDrafts, ''])}
              className="text-sm underline"
              style={{ color: COLORS.accent }}
            >
              + Add another joke
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function AddMissedDayForm({ onSubmit, onSubmitProduction, onCancel, mechanics, groupedEmployeeOptions, jobTypeFor, assignedUnitFor, unitTypesMap, blocks, defaultMechanic, t }) {
  const tr = t || ((k) => translations.en[k] || k);
  const initialPerson = defaultMechanic || (mechanics && mechanics[0]) || (groupedEmployeeOptions && groupedEmployeeOptions[0] && groupedEmployeeOptions[0].names[0]) || '';
  const [mechanic, setMechanic] = useState(initialPerson);
  const [date, setDate] = useState(() => localDateStr());
  const [clockInTime, setClockInTime] = useState('');
  const [clockOutTime, setClockOutTime] = useState('');
  const [lunchStartTime, setLunchStartTime] = useState('');
  const [lunchEndTime, setLunchEndTime] = useState('');
  const [startTime, setStartTime] = useState('');
  const [endTime, setEndTime] = useState('');
  const [block, setBlock] = useState('');
  const [spruce, setSpruce] = useState('');
  const [aspen, setAspen] = useState('');
  const [trees, setTrees] = useState('');
  const [loadCount, setLoadCount] = useState('');
  const [topPileCount, setTopPileCount] = useState('');
  const [error, setError] = useState('');

  const combine = (d, time) => (time ? `${d}T${time}` : null);
  const isProductionMode = !!groupedEmployeeOptions && jobTypeFor && jobTypeFor(mechanic) === 'production';
  const activeType = isProductionMode ? (unitTypesMap || {})[slugForUnit(assignedUnitFor(mechanic))] : null;

  const handleSave = () => {
    if (isProductionMode) {
      if (!date || !startTime) {
        setError('Pick a date and at least a start time.');
        return;
      }
      onSubmitProduction(
        mechanic,
        date,
        combine(date, startTime),
        combine(date, endTime),
        assignedUnitFor(mechanic),
        block,
        { spruce, aspen, trees, loadCount, topPileCount },
        setError
      );
      return;
    }
    if (!date || !clockInTime) {
      setError('Pick a date and at least a clock-in time.');
      return;
    }
    onSubmit(
      mechanic,
      date,
      combine(date, clockInTime),
      combine(date, clockOutTime),
      combine(date, lunchStartTime),
      combine(date, lunchEndTime),
      setError
    );
  };

  const fieldStyle = { background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` };
  const fieldClass = 'w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2';

  return (
    <div className="rounded-lg p-5 mb-6" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.accent}` }}>
      <h3 className="font-display text-sm font-bold uppercase tracking-wide mb-3">+ Add a missed day</h3>
      {groupedEmployeeOptions ? (
        <label className="block mb-3">
          <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Employee</span>
          <select value={mechanic} onChange={(e) => setMechanic(e.target.value)} className={fieldClass} style={fieldStyle}>
            {groupedEmployeeOptions.map((group) => (
              <optgroup key={group.label} label={group.label}>
                {group.names.map((m) => <option key={m} value={m}>{m}</option>)}
              </optgroup>
            ))}
          </select>
        </label>
      ) : mechanics && (
        <label className="block mb-3">
          <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Mechanic</span>
          <select value={mechanic} onChange={(e) => setMechanic(e.target.value)} className={fieldClass} style={fieldStyle}>
            {mechanics.map((m) => <option key={m} value={m}>{m}</option>)}
          </select>
        </label>
      )}
      <div className="grid grid-cols-2 gap-3 mb-3">
        <label className="block col-span-2">
          <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Date</span>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className={fieldClass} style={fieldStyle} />
        </label>
        {isProductionMode ? (
          <React.Fragment>
            <label className="block">
              <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Start</span>
              <input type="time" value={startTime} onChange={(e) => setStartTime(e.target.value)} className={fieldClass} style={fieldStyle} />
            </label>
            <label className="block">
              <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>End</span>
              <input type="time" value={endTime} onChange={(e) => setEndTime(e.target.value)} className={fieldClass} style={fieldStyle} />
            </label>
            {activeType !== 'fuel' && activeType !== 'winch' && (
              <label className="block col-span-2">
                <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Block number</span>
                <select value={block} onChange={(e) => setBlock(e.target.value)} className={fieldClass} style={fieldStyle}>
                  <option value="">— None —</option>
                  {(blocks || []).map((b) => <option key={b} value={b}>{b}</option>)}
                </select>
              </label>
            )}
            {activeType === 'buncher' && (
              <label className="block col-span-2">
                <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Tree count</span>
                <input type="number" inputMode="numeric" value={trees} onChange={(e) => setTrees(e.target.value)} className={fieldClass} style={fieldStyle} />
              </label>
            )}
            {(activeType === 'skidder' || activeType === 'processor') && (
              <React.Fragment>
                <label className="block">
                  <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Spruce</span>
                  <input type="number" inputMode="numeric" value={spruce} onChange={(e) => setSpruce(e.target.value)} className={fieldClass} style={fieldStyle} />
                </label>
                <label className="block">
                  <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Aspen</span>
                  <input type="number" inputMode="numeric" value={aspen} onChange={(e) => setAspen(e.target.value)} className={fieldClass} style={fieldStyle} />
                </label>
              </React.Fragment>
            )}
            {activeType === 'loader' && (
              <React.Fragment>
                <label className="block">
                  <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Loads</span>
                  <input type="number" inputMode="numeric" value={loadCount} onChange={(e) => setLoadCount(e.target.value)} className={fieldClass} style={fieldStyle} />
                </label>
                <label className="block">
                  <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Top piles</span>
                  <input type="number" inputMode="numeric" value={topPileCount} onChange={(e) => setTopPileCount(e.target.value)} className={fieldClass} style={fieldStyle} />
                </label>
              </React.Fragment>
            )}
          </React.Fragment>
        ) : (
          <React.Fragment>
            <label className="block">
              <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>{tr('clockIn')}</span>
              <input type="time" value={clockInTime} onChange={(e) => setClockInTime(e.target.value)} className={fieldClass} style={fieldStyle} />
            </label>
            <label className="block">
              <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>{tr('clockOut')}</span>
              <input type="time" value={clockOutTime} onChange={(e) => setClockOutTime(e.target.value)} className={fieldClass} style={fieldStyle} />
            </label>
            <label className="block">
              <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Break start (optional)</span>
              <input type="time" value={lunchStartTime} onChange={(e) => setLunchStartTime(e.target.value)} className={fieldClass} style={fieldStyle} />
            </label>
            <label className="block">
              <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>Break end (optional)</span>
              <input type="time" value={lunchEndTime} onChange={(e) => setLunchEndTime(e.target.value)} className={fieldClass} style={fieldStyle} />
            </label>
          </React.Fragment>
        )}
      </div>
      {error && <p className="text-xs mb-3" style={{ color: '#E07A5F' }}>{error}</p>}
      <div className="flex gap-2">
        <Btn onClick={handleSave}>Save day</Btn>
        <Btn variant="ghost" onClick={onCancel}>{tr('cancel')}</Btn>
      </div>
    </div>
  );
}

function NewOrderForm({ mechanics, units, onSubmit, onCancel, lockUnit, t, initialDescription, initialUnit, scanBanner }) {
  const tr = t || ((k) => translations.en[k] || k);
  const [description, setDescription] = useState(initialDescription || '');
  const [hours, setHours] = useState('');
  const [dueDate, setDueDate] = useState('');
  const [unit, setUnit] = useState(lockUnit || initialUnit || '');
  const [addingNewUnit, setAddingNewUnit] = useState(false);
  const [newUnitName, setNewUnitName] = useState('');

  const handleUnitChange = (val) => {
    if (val === '__new__') {
      setAddingNewUnit(true);
      setUnit('');
    } else {
      setAddingNewUnit(false);
      setUnit(val);
    }
  };

  const finalUnit = addingNewUnit ? newUnitName.trim() : unit;

  return (
    <div className="rounded-lg p-6 mb-6" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
      <h3 className="font-display text-lg font-bold mb-4">{tr('createWorkOrder')}</h3>
      {scanBanner && (
        <div className="rounded-lg p-3 mb-4 text-sm" style={{ background: 'rgba(127,163,126,0.15)', border: `1px solid ${COLORS.accent}`, color: COLORS.inkDim }}>
          📷 Filled in from a scanned photo — double-check everything below before saving.
        </div>
      )}

      {!lockUnit && (
        <label className="block mb-4">
          <span className="font-display text-sm font-semibold block mb-2" style={{ color: COLORS.ink }}>{tr('whichMachine')}</span>
          {!addingNewUnit ? (
            <select
              value={unit}
              onChange={(e) => handleUnitChange(e.target.value)}
              className="w-full rounded-lg px-4 py-2.5 text-base focus:outline-none focus:ring-2"
              style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
            >
              <option value="">{tr('selectMachine')}</option>
              {units.map((u) => <option key={u} value={u}>{u}</option>)}
              <option value="__new__">{tr('addNewMachine')}</option>
            </select>
          ) : (
            <div className="flex gap-2">
              <input
                value={newUnitName}
                onChange={(e) => setNewUnitName(e.target.value)}
                placeholder={tr('newMachineUnitNumber')}
                autoFocus
                className="flex-1 rounded-lg px-4 py-2.5 text-base focus:outline-none focus:ring-2 font-mono"
                style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
              />
              <button
                onClick={() => { setAddingNewUnit(false); setNewUnitName(''); }}
                className="px-3 rounded-lg text-sm"
                style={{ color: COLORS.inkDim, border: `1px solid ${COLORS.line}` }}
              >
                {tr('cancel')}

        <Btn onClick={() => canSubmit && onSubmit({ unit: finalUnit, description, hours, dueDate })} disabled={!canSubmit}>{tr('createJob')}</Btn>

function NoteCard({ note, isEditing, canEdit, onEdit, onCancel, onSave, onDelete, onSavePdt, lang }) {
  const [text, setText] = useState(note.text);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [pdtEditing, setPdtEditing] = useState(false);
  const [pdtDraft, setPdtDraft] = useState(note.pdtText || '');

  if (isEditing) {
    return (
      <div className="rounded-lg p-4" style={{ background: COLORS.surface, border: `2px solid ${COLORS.accent}` }}>
        <textarea
          value={text}
          onChange={(e) => setText(e.target.value)}
          rows={3}
          autoFocus
          className="w-full rounded-lg px-4 py-3 text-base focus:outline-none focus:ring-2 resize-none mb-3"
          style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
        />
        <div className="flex gap-2">
          <Btn onClick={() => text.trim() && onSave(text)} disabled={!text.trim()}>Save</Btn>
          <Btn variant="ghost" onClick={onCancel}>Cancel</Btn>
        </div>
      </div>
    );
  }

  const isShoutout = note.type === 'shoutout';

  return (
    <div
      className="rounded-lg p-4"
      style={{
        background: isShoutout ? 'rgba(127,163,126,0.14)' : COLORS.surface,
        border: `1px solid ${isShoutout ? COLORS.accent : COLORS.line}`,
      }}
    >
      <div className="flex items-center justify-between mb-2">
        <span className="font-display font-semibold text-sm" style={{ color: COLORS.accent }}>
          {isShoutout ? '🎉' : '💬'} {note.author}
        </span>
        <div className="flex items-center gap-3">
          <span className="font-mono text-xs" style={{ color: COLORS.line }}>
            {new Date(note.ts).toLocaleString()}{note.edited ? ' (edited)' : ''}
          </span>
          {canEdit && !confirmDelete && (
            <button onClick={onEdit} className="text-xs underline" style={{ color: COLORS.inkDim }}>Edit</button>
          )}
          {canEdit && !confirmDelete && (
            <button onClick={() => setPdtEditing((s) => !s)} className="text-xs" style={{ color: COLORS.inkDim }}>🌐</button>
          )}
          {canEdit && !confirmDelete && (
            <button onClick={() => setConfirmDelete(true)} className="text-xs underline" style={{ color: '#E07A5F' }}>Delete</button>
          )}
          {confirmDelete && (
            <React.Fragment>
              <button onClick={onDelete} className="text-xs font-semibold underline" style={{ color: '#E07A5F' }}>Confirm</button>
              <button onClick={() => setConfirmDelete(false)} className="text-xs underline" style={{ color: COLORS.inkDim }}>Cancel</button>
            </React.Fragment>
          )}
        </div>
      </div>
      <p className="text-base">{lang === 'pdt' && note.pdtText ? note.pdtText : lang === 'es' && note.originalLang === 'es' ? note.originalText : note.text}</p>
      {note.originalLang === 'es' && lang !== 'es' && lang !== 'pdt' && (
        <p className="text-xs mt-1" style={{ color: COLORS.line }}>Translated from Spanish</p>
      )}
      {pdtEditing && (
        <div className="mt-3 pt-3" style={{ borderTop: `1px solid ${COLORS.line}` }}>
          <textarea
            value={pdtDraft}
            onChange={(e) => setPdtDraft(e.target.value)}
            placeholder="Plautdietsch..."
            rows={2}
            className="w-full rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 resize-none mb-2"
            style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}

            <Btn onClick={() => { onSavePdt(pdtDraft); setPdtEditing(false); }}>Save Plautdietsch</Btn>

          </div>
        </div>
      )}
    </div>
  );
}

function PhotosSection({ order, onAdd, onRemove, t }) {
  const tr = t || ((k) => translations.en[k] || k);
  const [uploading, setUploading] = useState(false);
  const [viewerPhoto, setViewerPhoto] = useState(null);
  const media = order.media || [];

  const handleFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    setUploading(true);
    try {
      const compressed = await Promise.all(files.map((f) => compressImage(f)));
      await onAdd(compressed);
    } catch (err) {
      console.error('photo upload failed', err);
    }
    setUploading(false);
    e.target.value = '';
  };

  return (
    <div className="mt-8 no-print">
      <h3 className="font-display text-lg font-bold mb-4">{tr('photos')}</h3>

      {media.length > 0 && (
        <div className="grid grid-cols-3 gap-2 mb-4">
          {media.map((m) => (
            <div key={m.id} className="relative aspect-square rounded-lg overflow-hidden" style={{ border: `1px solid ${COLORS.line}` }}>
              <img
                src={m.dataUrl}
                onClick={() => setViewerPhoto(m)}
                className="w-full h-full object-cover cursor-pointer"
                alt="Problem photo"
              />
              <button
                onClick={() => onRemove(m.id)}
                className="absolute top-1 right-1 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold"
                style={{ background: 'rgba(0,0,0,0.6)', color: '#fff' }}
              >
                ✕
              </button>
            </div>
          ))}
        </div>
      )}

      <label
        className="block text-center rounded-lg py-4 cursor-pointer font-display font-semibold uppercase tracking-wide text-sm"
        style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}`, color: COLORS.accent }}
      >
        {uploading ? tr('uploadingDots') : tr('addPhotosProblem')}
        <input
          type="file"
          accept="image/*"
          capture="environment"
          multiple
          onChange={handleFiles}
          className="hidden"
          disabled={uploading}
        />
      </label>

      {viewerPhoto && (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4"
          style={{ background: 'rgba(0,0,0,0.9)' }}
          onClick={() => setViewerPhoto(null)}
        >
          <img src={viewerPhoto.dataUrl} className="max-w-full max-h-full rounded-lg" alt="Problem photo full size" />
        </div>
      )}
    </div>
  );
}


// Catches errors thrown while rendering and shows exactly which component
// broke and why — this is real diagnostic detail, unlike the browser's
// often-blank "Script error." for the same failure.
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null, info: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    this.setState({ info });
  }
  render() {
    if (this.state.error) {
      const msg =
        (this.state.error && this.state.error.stack ? this.state.error.stack : String(this.state.error)) +
        (this.state.info && this.state.info.componentStack ? '\n\nComponent stack:' + this.state.info.componentStack : '');
      return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '2rem', fontFamily: 'sans-serif', color: '#ECE8DF', background: '#1B1E20', textAlign: 'center' }}>
          <div style={{ maxWidth: 520 }}>
            <h1 style={{ color: '#E8622C', fontSize: '1.4rem' }}>Something broke on this screen</h1>
            <p style={{ marginTop: '1rem' }}>Screenshot this and send it back — this has the exact detail needed to fix it:</p>
            <button onClick={() => window.location.reload()} style={{ marginTop: '1rem', padding: '0.75rem 1.5rem', fontSize: '1rem', fontWeight: 'bold', background: '#7FA37E', color: '#1B1F19', border: 'none', borderRadius: 8, cursor: 'pointer' }}>Try again</button>
            <pre style={{ textAlign: 'left', background: '#242829', padding: '1rem', borderRadius: 8, overflow: 'auto', fontSize: '0.7rem', whiteSpace: 'pre-wrap', marginTop: '1.5rem' }}>{msg}</pre>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
