        addNote(latestOrder.id, `🎉 ${m} just completed their ${nextMilestone}th work order! Great work.`, 'shoutout');
      }
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [orders, mechanics, currentMechanic]);

  const resolveMilestonePrompt = async (customText) => {
    if (!milestonePrompt) return;
    const { mechanic, count, orderId } = milestonePrompt;
    const message = (customText || '').trim() || `🎉 ${mechanic} just hit ${count} completed work orders! Incredible work.`;
    await addNote(orderId, message, 'shoutout');
    const already = milestonesCelebrated[mechanic] || [];
    const next = { ...milestonesCelebrated, [mechanic]: [...already, count] };
    setMilestonesCelebrated(next);
    await saveMilestonesCelebrated(next);
    setMilestonePrompt(null);
  };

  const [timeClockActionPending, setTimeClockActionPending] = useState(false);

  // These buttons react to live data from Firebase, and on a weak signal
  // there's a real window where the screen briefly reverts to the old state
  // before the write actually lands — a repeat tap in that window can hit
  // the wrong button entirely (e.g. lands on Clock Out instead of End
  // Break). Locking the button the instant it's tapped closes that window.
  const clockIn = async () => {
    if (timeClockActionPending) return;
    setTimeClockActionPending(true);
    const entry = {
      id: uid(),
      mechanic: currentMechanic,
      date: todayStr(),
      clockIn: new Date().toISOString(),
      lunchStart: null,
      lunchEnd: null,
      skippedLunch: false,
      clockOut: null,
      jobs: [],
    };
    try {
      await persistTimesheets([...timesheets, entry]);
    } finally {
      setTimeClockActionPending(false);
    }
  };

  const startLunch = async () => {
    if (!openEntry || timeClockActionPending) return;
    setTimeClockActionPending(true);
    const next = timesheets.map((t) => (t.id === openEntry.id ? { ...t, lunchStart: new Date().toISOString() } : t));
    try {
      await persistTimesheets(next);
    } finally {
      setTimeClockActionPending(false);
    }
  };

  const endLunch = async () => {
    if (!openEntry || timeClockActionPending) return;
    setTimeClockActionPending(true);
    const next = timesheets.map((t) => (t.id === openEntry.id ? { ...t, lunchEnd: new Date().toISOString() } : t));
    try {
      await persistTimesheets(next);
    } finally {
      setTimeClockActionPending(false);
    }
  };

  const [pendingClockOutSkippedLunch, setPendingClockOutSkippedLunch] = useState(null);

  const clockOut = async (skippedLunch, signatureDataUrl) => {
    if (!openEntry) return;
    const next = timesheets.map((t) =>
      t.id === openEntry.id
        ? {
            ...t,
            clockOut: new Date().toISOString(),
            skippedLunch: !!skippedLunch,
            signature: signatureDataUrl || null,
            signedAt: signatureDataUrl ? new Date().toISOString() : null,
          }
        : t
    );
    await persistTimesheets(next);
    setLunchPrompt(false);
    setPendingClockOutSkippedLunch(null);
    setTodaysJobChoice(null);
  };

  const attemptClockOut = async () => {
    if (!openEntry) return;
    // Same stale-state risk seen elsewhere — if the app was just reopened
    // and hasn't finished syncing yet, local state could still show the
    // break as missing even though it was genuinely recorded. A fresh,
    // direct read avoids incorrectly prompting in that case.
    let effectiveEntry = openEntry;
    try {
      const snap = await firebase.database().ref('timesheets').once('value');
      const fresh = (snap.val() || []).find((t) => t.id === openEntry.id);
      if (fresh) effectiveEntry = fresh;
    } catch (e) {
      // offline or similar — fall back to local state rather than blocking clock-out entirely
    }
    const hasLunch = effectiveEntry.lunchStart && effectiveEntry.lunchEnd;
    if (!hasLunch && !effectiveEntry.skippedLunch) {
      setLunchPrompt(true);
      return;
    }
    setPendingClockOutSkippedLunch(effectiveEntry.skippedLunch || false);
  };

  const addTimesheetJob = async (entryId, unit, hours) => {
    const trimmedUnit = unit.trim();
    const parsedHours = parseFloat(hours);
    if (!trimmedUnit || !parsedHours || parsedHours <= 0) return;
    const next = timesheets.map((t) =>
      t.id === entryId ? { ...t, jobs: [...(t.jobs || []), { id: uid(), unit: trimmedUnit, hours: parsedHours }] } : t
    );
    await persistTimesheets(next);
  };

  const removeTimesheetJob = async (entryId, jobId) => {
    const next = timesheets.map((t) =>
      t.id === entryId ? { ...t, jobs: (t.jobs || []).filter((j) => j.id !== jobId) } : t
    );
    await persistTimesheets(next);
  };

  const updateTimesheetEntry = async (entryId, patch) => {
    const next = timesheets.map((t) => (t.id === entryId ? { ...t, ...patch } : t));
    await persistTimesheets(next);
  };

  const deleteTimesheetEntry = async (entryId) => {
    await persistTimesheets(timesheets.filter((t) => t.id !== entryId));
  };

  // Adds a whole missed day — for when clock in/out was forgotten entirely,
  // so there's no existing entry to edit. mechanicName lets an admin add a
  // day on behalf of anyone; a mechanic adding their own just passes their
  // own name.
  const addManualEntry = async (mechanicName, date, clockInLocal, clockOutLocal, lunchStartLocal, lunchEndLocal) => {
    const entry = {
      id: uid(),
      mechanic: mechanicName,
      date,
      clockIn: clockInLocal ? new Date(clockInLocal).toISOString() : null,
      clockOut: clockOutLocal ? new Date(clockOutLocal).toISOString() : null,
      lunchStart: lunchStartLocal ? new Date(lunchStartLocal).toISOString() : null,
      lunchEnd: lunchEndLocal ? new Date(lunchEndLocal).toISOString() : null,
      skippedLunch: !lunchStartLocal && !lunchEndLocal,
      jobs: [],
    };
    await persistTimesheets([...timesheets, entry]);
  };

  const addManualProductionShift = async (employeeName, date, startLocal, endLocal, machine, block, numbers) => {
    const shift = {
      id: uid(),
      employee: employeeName,
      employeeRole: roleFor(employeeName),
      machine,
      block: block || null,
      start: startLocal ? new Date(startLocal).toISOString() : null,
      end: endLocal ? new Date(endLocal).toISOString() : null,
      extraTasks: [],
      downtimeLog: [],
      ...numbers,
    };
    await persistProductionShifts([...productionShifts, stripUndefined(shift)]);
  };

  const isWeekApproved = (weekStart) => !!timesheetApprovals[weekStart];

  const approveWeek = async (weekStart) => {
    const next = { ...timesheetApprovals, [weekStart]: { approvedBy: currentMechanic, approvedAt: new Date().toISOString() } };
    setTimesheetApprovals(next);
    await saveTimesheetApprovals(next);
  };

  const unapproveWeek = async (weekStart) => {
    const next = { ...timesheetApprovals };
    delete next[weekStart];
    setTimesheetApprovals(next);
    await saveTimesheetApprovals(next);
  };

  const exportTimesheets = async (entries, productionEntries, filenamePrefix) => {
    const rows = [];

    if (entries.length > 0) {
      rows.push(['═══ MECHANICS ═══']);
      rows.push(['Mechanic', 'Date', 'Clock In', 'Clock Out', 'Break Start', 'Break End', 'Worked Through Break', 'Paid Hours', 'Signed', 'Jobs (unit: hours)']);
      const sorted = [...entries].sort((a, b) => (a.mechanic || '').localeCompare(b.mechanic || '') || a.date.localeCompare(b.date));
      let lastMechanic = null;
      sorted.forEach((e) => {
        if (e.mechanic !== lastMechanic) {
          if (lastMechanic !== null) rows.push([]); // a blank row alone can collapse to nothing in some previews
          rows.push([`── ${e.mechanic} ──`]); // so a clearly labeled divider does the actual separating
        }
        lastMechanic = e.mechanic;
        const jobsStr = (e.jobs || []).map((j) => `${j.unit}: ${j.hours}h`).join(' | ');
        rows.push([
          e.mechanic,
          e.date,
          fmtTime(e.clockIn),
          fmtTime(e.clockOut),
          fmtTime(e.lunchStart),
          fmtTime(e.lunchEnd),
          e.skippedLunch ? 'Yes' : 'No',
          fmtHoursDecimal(entryHours(e)),
          e.signature ? 'Yes' : 'No',
          jobsStr,
        ]);
      });
    }

    if (productionEntries && productionEntries.length > 0) {
      if (entries.length > 0) { rows.push([]); rows.push([]); }
      rows.push(['═══ PRODUCTION ═══']);
      rows.push(['Employee', 'Date', 'Machine', 'Block', 'Start', 'End', 'Paid Hours', 'Extra Hours (billing only)', 'Production', 'Downtime Reports']);
      const sortedProd = [...productionEntries].sort((a, b) => (a.employee || '').localeCompare(b.employee || '') || (a.end || '').localeCompare(b.end || ''));
      let lastEmployee = null;
      sortedProd.forEach((s) => {
        if (s.employee !== lastEmployee) {
          if (lastEmployee !== null) rows.push([]);
          rows.push([`── ${s.employee} ──`]);
        }
        lastEmployee = s.employee;
        const hours = s.start && s.end ? (new Date(s.end) - new Date(s.start)) / 1000 / 60 / 60 : 0;
        const extraHours = (s.extraTasks || []).reduce((sum, t) => sum + (parseFloat(t.hours) || 0), 0);
        rows.push([
          s.employee,
          (s.end || s.start || '').slice(0, 10),
          s.machine,
          s.block || '',
          fmtTime(s.start),
          fmtTime(s.end),
          fmtHoursDecimal(hours),
          extraHours > 0 ? fmtHoursDecimal(extraHours) : '',
          productionSummary(s, unitTypes),
          (s.downtimeLog || []).length || '',
        ]);
      });
    }

    const csv = rows.map((r) => r.map((cell) => `"${String(cell || '').replace(/"/g, '""')}"`).join(',')).join('\n');
    const filename = `${filenamePrefix || 'timesheets'}-${todayStr()}.csv`;
    const file = new File([csv], filename, { type: 'text/csv' });

    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: 'Timesheets export',
          text: timesheetSettings.email ? `Timesheets for ${timesheetSettings.email}` : 'Timesheets export',
        });
        return;
      } catch (e) {
        // user cancelled the share sheet — fall through to download
      }
    }
    // Fallback: plain download if sharing isn't available on this device
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  };

  const addUnit = async (type) => {
    const name = newUnitName.trim();
    if (!name || units.includes(name)) return;
    await persistMeta(mechanics, [...units, name]);
    if (type) await firebase.database().ref('unitTypes/' + slugForUnit(name)).set(type).catch(() => alert("Couldn't save the type tag — check your signal and try again."));
    setNewUnitName('');
    setShowAddUnit(false);
  };
  const setUnitType = async (name, type) => {
    if (type) {
      await firebase.database().ref('unitTypes/' + slugForUnit(name)).set(type).catch(() => alert("Couldn't save — check your signal and try again."));
    } else {
      await firebase.database().ref('unitTypes/' + slugForUnit(name)).remove().catch(() => alert("Couldn't save — check your signal and try again."));
    }
  };
  const renameUnit = async (oldName, newName) => {
    const trimmed = newName.trim();
    if (!trimmed || trimmed === oldName) return;
    if (units.includes(trimmed)) {
      alert('A unit with that number already exists.');
      return;
    }
    await persistMeta(mechanics, units.map((u) => (u === oldName ? trimmed : u)));
    const oldType = unitTypes[slugForUnit(oldName)];
    if (oldType) {
      await firebase.database().ref('unitTypes/' + slugForUnit(trimmed)).set(oldType).catch(() => {});
      await firebase.database().ref('unitTypes/' + slugForUnit(oldName)).remove().catch(() => {});
    }
    // Anyone currently assigned to this unit should follow the rename,
    // rather than being silently left pointing at a unit number that no
    // longer exists.
    const reassignments = {};
    Object.entries(unitAssignments).forEach(([slug, unit]) => {
      if (unit === oldName) reassignments[slug] = trimmed;
    });
    if (Object.keys(reassignments).length > 0) {
      await firebase.database().ref('unitAssignments').update(reassignments).catch(() => alert("Renamed the unit, but couldn't update everyone's assignment — check their assignment manually."));
    }
  };

  const createOrder = async (data, scanPhotoDataUrl) => {
    const unitName = (data.unit || activeUnit || '').trim();
    if (!unitName) return;
    if (!units.includes(unitName)) {
      await persistMeta(mechanics, [...units, unitName]);
    }
    const descriptionField = await buildLocalizedField(data.description, lang);
    const order = {
      id: uid(),
      unit: unitName,
      description: descriptionField,
      workedOnBy: [currentMechanic],
      hours: data.hours,
      dueDate: data.dueDate,
      dateCreated: localDateStr(),
      status: 'Open',
      notes: [],
      createdBy: currentMechanic,
      onBoard: true, // new orders show up right away; older/queued ones need to be pulled out deliberately
      media: scanPhotoDataUrl ? [{ id: uid(), dataUrl: scanPhotoDataUrl, author: currentMechanic, ts: new Date().toISOString() }] : [],
    };
    await persistOrders([order, ...orders]);
    setShowAddOrder(false);
    setScanReviewData(null);
  };

  // Older orders saved before this feature existed have no onBoard field at
  // all — treated as already on the board so nothing already-visible
  // suddenly vanishes the moment this ships.
  const isOnBoard = (order) => order.onBoard !== false;

  const pullOntoBoard = async (orderId) => {
    await updateOrder(orderId, { onBoard: true });
  };

  const pullOffBoard = async (orderId) => {
    await updateOrder(orderId, { onBoard: false });
  };

  // Sends a photo of a receipt/invoice to the backend, which asks Claude to
  // read it, then opens the normal new-work-order form pre-filled with
  // whatever it found — nothing is ever saved without the person reviewing
  // and confirming it first.
  const handleScanReceipt = async (file) => {
    setScanningReceipt(true);
    try {
      const compressed = await compressImage(file);
      const base64 = compressed.split(',')[1];
      const res = await fetch(CLOUD_FUNCTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: APP_SECRET, mode: 'scanReceipt', image: base64, mediaType: 'image/jpeg' }),
      });
      if (!res.ok) throw new Error('Scan failed');
      const data = await res.json();
      const ex = data.extracted || {};
      const descParts = [];
      if (ex.vendor) descParts.push(`Vendor: ${ex.vendor}`);
      if (ex.amount) descParts.push(`Amount: ${ex.amount}`);
      if (ex.date) descParts.push(`Date on receipt: ${ex.date}`);
      if (ex.description) descParts.push(ex.description);
      setScanReviewData({
        description: descParts.join('\n'),
        unit: ex.unit && units.includes(ex.unit) ? ex.unit : '',
        photoDataUrl: compressed,
      });
      setShowAddOrder(true);
    } catch (e) {
      alert("Couldn't read that photo — check your signal and try again, or just type in the work order normally.");
    } finally {
      setScanningReceipt(false);
    }
  };

  // Instead of pre-assigning who's "supposed" to work on something,
  // whoever actually opens and edits an order (including just checking
  // off a checklist item) gets automatically credited on it — every
  // checklist-related function already funnels through here, so this one
  // spot covers all of them.
  const withWorkedOnBy = (order) => {
    const existing = order.workedOnBy || [];
    if (existing.includes(currentMechanic)) return existing;
    return [...existing, currentMechanic];
  };

  const updateOrder = async (id, patch) => {
    const next = orders.map((o) => (o.id === id ? { ...o, ...patch, workedOnBy: withWorkedOnBy(o) } : o));
    await persistOrders(next);
  };

  const addNote = async (id, text, type) => {
    if (!text.trim()) return;
    const trimmed = text.trim();
    const note = { id: uid(), author: currentMechanic, text: trimmed, ts: new Date().toISOString(), type: type || 'note' };
    if (lang === 'es') {
      const translated = await translateText(trimmed);
      if (translated) {
        note.originalText = trimmed;
        note.originalLang = 'es';
        note.text = translated;
      }
    }
    const next = orders.map((o) => (o.id === id ? { ...o, notes: [...(o.notes || []), note], workedOnBy: withWorkedOnBy(o) } : o));
    await persistOrders(next);
  };

  const updateNote = async (orderId, noteId, text) => {
    if (!text.trim()) return;
    const next = orders.map((o) =>
      o.id === orderId
        ? { ...o, notes: (o.notes || []).map((n) => (n.id === noteId ? { ...n, text: text.trim(), edited: true } : n)) }
        : o
    );
    await persistOrders(next);
    setEditingNoteId(null);
  };

  const deleteNote = async (orderId, noteId) => {
    const next = orders.map((o) =>
      o.id === orderId ? { ...o, notes: (o.notes || []).filter((n) => n.id !== noteId) } : o
    );
    await persistOrders(next);
  };

  const saveNotePdt = async (orderId, noteId, pdtText) => {
    const next = orders.map((o) =>
      o.id === orderId
        ? { ...o, notes: (o.notes || []).map((n) => (n.id === noteId ? { ...n, pdtText: pdtText.trim() || null } : n)) }
        : o
    );
    await persistOrders(next);
  };

  const addPhotos = async (id, dataUrls) => {
    const photos = dataUrls.map((dataUrl) => ({
      id: uid(),
      dataUrl,
      author: currentMechanic,
      ts: new Date().toISOString(),
    }));
    const next = orders.map((o) => (o.id === id ? { ...o, media: [...(o.media || []), ...photos], workedOnBy: withWorkedOnBy(o) } : o));
    await persistOrders(next);
  };

  const removePhoto = async (orderId, photoId) => {
    const next = orders.map((o) =>
      o.id === orderId ? { ...o, media: (o.media || []).filter((m) => m.id !== photoId) } : o
    );
    await persistOrders(next);
  };

  const deleteOrder = async (id) => {
    await persistOrders(orders.filter((o) => o.id !== id));
    setScreen('unit');
    setConfirmDelete(false);
  };

  if (loading) {
    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="flex items-center justify-center font-display">
        {FONT_STYLE}
        <OfflineBanner isOnline={isOnline} />
        <PinModalOverlay
          pinModal={pinModal}
          pinInput={pinInput}
          setPinInput={setPinInput}
          pinError={pinError}
          onSubmit={submitPin}
          onCancel={cancelPinModal}
          onForgot={forgotPin}
          t={t}
        />
        <EmailPromptOverlay
          show={showEmailPrompt}
          onSave={async (email) => {
            await saveMechanicEmail(currentMechanic, email);
            setShowEmailPrompt(false);
          }}
          onSkip={() => setShowEmailPrompt(false)}
        />
        <PushPromptOverlay
          show={showPushPrompt}
          mechanic={currentMechanic}
          onEnable={async () => {
            await registerPushNotifications(currentMechanic);
            setShowPushPrompt(false);
          }}
          onSkip={() => setShowPushPrompt(false)}
        />
        <BiometricOfferOverlay
          mechanic={offerBiometric}
          onEnable={async () => {
            const name = offerBiometric;
            setOfferBiometric(null);
            try {
              await registerBiometric(name);
            } catch (e) {
              // ignore — user can enable it later from the board
            }
          }}
          onSkip={() => setOfferBiometric(null)}
        />
        <span className="text-sm uppercase tracking-widest" style={{ color: COLORS.inkDim }}>Loading board…</span>
      </div>
    );
  }

  // ---------- LOGIN-RECOVERY LINK ----------
  // Takes priority over the normal login screen whenever a valid or
  // invalid token is present in the URL — someone arrived here from the
  // emailed link, not through the usual sign-in flow.
  if (loginTokenState) {
    return (
      <SetNewPinScreen
        state={loginTokenState}
        t={t}
        onDone={async (mechanic) => {
          localStorage.setItem('deviceMechanic', mechanic);
          addDeviceUser(mechanic);
          setCurrentMechanic(mechanic);
          // Same fresh-page-load risk as the PIN-setup flow — read their
          // real unit assignment directly rather than trusting local state
          // that may not have finished syncing yet. Retried once, since
          // falling back to that same local state on a single transient
          // failure would just reproduce the exact bug this is fixing.
          const readRealAssignment = async () => {
            const slug = slugForMechanic(mechanic);
            const [assignSnap, typesSnap] = await Promise.all([
              firebase.database().ref('unitAssignments/' + slug).once('value'),
              firebase.database().ref('unitTypes').once('value'),
            ]);
            return { realUnit: assignSnap.val() || '', realUnitTypes: typesSnap.val() || {} };
          };
          let landing;
          try {
            let result;
            try {
              result = await readRealAssignment();
            } catch (e) {
              await new Promise((r) => setTimeout(r, 1200));
              result = await readRealAssignment();
            }
            landing = MACHINE_TYPE_LABELS[machineType(result.realUnit, result.realUnitTypes)] ? 'shift' : 'dashboard';
          } catch (e) {
            landing = landingScreenFor(mechanic); // both attempts failed (genuinely offline) — fall back to local state
          }
          setScreen(landing);
          setLoginTokenState(null);
        }}
      />
    );
  }

  // ---------- LOGIN ----------
  if (screen === 'login' || !currentMechanic) {
    return (
      <div style={{ color: COLORS.ink, minHeight: '100vh', position: 'relative', overflow: 'hidden' }} className="font-body p-6 flex flex-col items-center justify-center">
        {FONT_STYLE}
        <svg
          viewBox="0 0 400 200"
          preserveAspectRatio="xMidYMax slice"
          style={{ position: 'absolute', bottom: 0, left: 0, width: '100%', height: '35vh', opacity: 0.12, pointerEvents: 'none' }}
        >
          <path d="M40 200 L40 140 L20 140 L45 90 L28 90 L55 40 L82 90 L65 90 L90 140 L70 140 L70 200 Z" fill={COLORS.accent} />
          <path d="M130 200 L130 120 L105 120 L135 60 L114 60 L148 0 L182 60 L161 60 L191 120 L166 120 L166 200 Z" fill={COLORS.accent} />
          <path d="M250 200 L250 130 L228 130 L255 75 L238 75 L265 25 L292 75 L275 75 L302 130 L280 130 L280 200 Z" fill={COLORS.accent} />
          <path d="M345 200 L345 145 L327 145 L350 100 L335 100 L358 55 L381 100 L366 100 L389 145 L371 145 L371 200 Z" fill={COLORS.accent} />
        </svg>
        <OfflineBanner isOnline={isOnline} />
        <PinModalOverlay
          pinModal={pinModal}
          pinInput={pinInput}
          setPinInput={setPinInput}
          pinError={pinError}
          onSubmit={submitPin}
          onCancel={cancelPinModal}
          onForgot={forgotPin}
          t={t}
        />
        <EmailPromptOverlay
          show={showEmailPrompt}
          onSave={async (email) => {
            await saveMechanicEmail(currentMechanic, email);
            setShowEmailPrompt(false);
          }}
          onSkip={() => setShowEmailPrompt(false)}
        />
        <PushPromptOverlay
          show={showPushPrompt}
          mechanic={currentMechanic}
          onEnable={async () => {
            await registerPushNotifications(currentMechanic);
            setShowPushPrompt(false);
          }}
          onSkip={() => setShowPushPrompt(false)}
        />
        <BiometricOfferOverlay
          mechanic={offerBiometric}
          onEnable={async () => {
            const name = offerBiometric;
            setOfferBiometric(null);
            try {
              await registerBiometric(name);
            } catch (e) {
              // ignore — user can enable it later from the board
            }
          }}
          onSkip={() => setOfferBiometric(null)}
        />
        <div className="max-w-md w-full" style={{ position: 'relative', zIndex: 1 }}>
          <div className="flex items-center justify-center gap-2 mb-4">
            {[
              { code: 'en', label: 'English' },
              { code: 'es', label: 'Español' },
              { code: 'pdt', label: 'Plautdietsch' },
            ].map((l) => (
              <button
                key={l.code}
                onClick={() => setLangPersist(l.code)}
                className="font-display text-xs uppercase tracking-wider font-semibold px-3 py-2 rounded-lg"
                style={{
                  color: lang === l.code ? '#1B1F19' : COLORS.ink,
                  background: lang === l.code ? COLORS.accent : COLORS.surface,
                  border: `2px solid ${COLORS.accent}`,
                }}
              >
                {l.label}
              </button>
            ))}
          </div>
          <div className="text-center mb-10">
            <h1 className="font-display text-4xl font-bold mb-2">Harder Contracting</h1>
            <p className="text-base" style={{ color: COLORS.inkDim }}>{t('pickYourName')}</p>
          </div>

          {mechanics.length > 0 && (() => {
            const rememberedName = localStorage.getItem('deviceMechanic');
            const rememberedStillExists = rememberedName && mechanics.includes(rememberedName);
            const revealAll = showAllMechanics || !rememberedStillExists;
            // Only people who've actually signed in on this exact device —
            // a shared shop tablet shouldn't show the entire company roster.
            // New people arrive via their own invite link, never through this
            // list. An existing employee on an unfamiliar device uses "Lost
            // access? Get a login link" below, not a way to browse everyone.
            const deviceUsers = getDeviceUsers().filter((m) => mechanics.includes(m));
            const namesToShow = deviceUsers.length > 0 ? deviceUsers : mechanics;
            return (
              <div className="mb-8">
                <p className="font-display text-xs uppercase tracking-wider mb-3 block" style={{ color: COLORS.inkDim }}>
                  {revealAll ? t('tapToSignIn') : t('welcomeBack')}
                </p>
                {revealAll ? (
                  <div className="grid grid-cols-2 gap-3">
                    {namesToShow.map((m) => (
                      <button
                        key={m}
                        onClick={() => handleMechanicTap(m)}
                        className="rounded-lg px-4 py-5 font-medium text-center focus:outline-none focus:ring-2 transition-all hover:scale-105 active:scale-95 relative"
                        style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}`, color: COLORS.ink }}
                      >
                        {m}
                        {!!localStorage.getItem('webauthn_cred_' + m) && (
                          <span className="absolute top-1.5 right-2 text-xs" title="Face ID / Touch ID available">🔓</span>
                        )}
                      </button>
                    ))}
                  </div>
                ) : (
                  <div>
                    <button
                      onClick={() => handleMechanicTap(rememberedName)}
                      className="w-full rounded-lg px-4 py-6 font-display font-bold text-xl text-center focus:outline-none focus:ring-2 transition-all hover:scale-105 active:scale-95 relative"
                      style={{ background: COLORS.surface, border: `2px solid ${COLORS.accent}`, color: COLORS.ink }}
                    >
                      {rememberedName}
                      {!!localStorage.getItem('webauthn_cred_' + rememberedName) && (
                        <span className="absolute top-2 right-3 text-sm" title="Face ID / Touch ID available">🔓</span>
                      )}
                    </button>
                    <button
                      onClick={() => setShowAllMechanics(true)}
                      className="w-full text-center text-xs underline mt-3"
                      style={{ color: COLORS.inkDim }}
                    >
                      {t('notYouSwitchUser')}
                    </button>
                  </div>
                )}
                <div className="h-px my-6" style={{ background: COLORS.line }} />
              </div>
            );
          })()}

          {inviteTokenState === 'invalid' && (
            <div className="rounded-lg p-5 shop-card" style={{ background: COLORS.surface, border: `2px dashed #E07A5F` }}>
              <p className="text-sm" style={{ color: '#E07A5F' }}>
                That invite link is invalid or has expired. Ask your admin to send you a fresh one.
              </p>
            </div>
          )}

          <div className="text-center mt-4">
            {!showLostAccess ? (
              <button
                onClick={() => setShowLostAccess(true)}
                className="text-xs underline"
                style={{ color: COLORS.inkDim }}
              >
                {t('lostAccess')} {t('getLoginLink')}
              </button>
            ) : lostAccessSubmitted ? (
              <p className="text-sm rounded-lg p-4" style={{ background: COLORS.surface, color: COLORS.inkDim, border: `1px solid ${COLORS.line}` }}>
                {t('lostAccessSubmitted')}
              </p>
            ) : (
              <div className="rounded-lg p-5 text-left" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
                <p className="font-display text-sm uppercase tracking-wide mb-2" style={{ color: COLORS.accent }}>{t('getLoginLink')}</p>
                <p className="text-xs mb-3" style={{ color: COLORS.inkDim }}>{t('lostAccessHelper')}</p>
                <input
                  type="email"
                  value={lostAccessEmail}
                  onChange={(e) => setLostAccessEmail(e.target.value)}
                  placeholder={t('lostAccessEmailPlaceholder')}
                  className="w-full rounded-lg px-4 py-2 text-base mb-3 focus:outline-none focus:ring-2"
                  style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                />
                <Btn onClick={requestLoginLink} disabled={lostAccessSubmitting || !lostAccessEmail.trim()}>
                  {lostAccessSubmitting ? '…' : t('sendLink')}
                </Btn>
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  // ---------- DASHBOARD ----------
  if (screen === 'dashboard') {
    const q = searchQuery.trim().toLowerCase();
    const searchResults = q
      ? orders.filter((o) => {
          const haystack = [
            getLocalizedText(o.description, lang),
            o.unit,
            ...getAssignedMechanics(o),
            o.status,
            ...(o.notes || []).map((n) => n.text),
          ]
            .filter(Boolean)
            .join(' ')
            .toLowerCase();
          return haystack.includes(q);
        })
      : [];
    const openOrders = orders
      .filter((o) => o.status !== 'Done')
      .slice()
      .sort((a, b) => {
        if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
        if (a.dueDate) return -1;
        if (b.dueDate) return 1;
        return 0;
      });

    // Only orders someone has actually pulled onto the board show here —
    // everything else stays tucked away in the dropdown until picked, so
    // the board doesn't get cluttered with every open job at once.
    const visibleOpenOrders = openOrders.filter(isOnBoard);
    const queuedOrders = openOrders.filter((o) => !isOnBoard(o));

    // Queued orders, grouped by unit for the "pull onto board" dropdown —
    // sorted numerically so "C10" comes after "C2", not before it.
    const queuedByUnit = {};
    queuedOrders.forEach((o) => {
      const key = o.unit || 'No unit';
      if (!queuedByUnit[key]) queuedByUnit[key] = [];
      queuedByUnit[key].push(o);
    });
    const queuedUnitGroups = Object.keys(queuedByUnit).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

    const renderOrderCard = (o) => {
      const isDone = o.status === 'Done';
      return (
        <div
          key={o.id}
          onClick={() => { setActiveUnit(o.unit); setActiveOrderId(o.id); setScreen('order'); setConfirmDelete(false); }}
          role="button"
          tabIndex={0}
          style={{ background: isDone ? COLORS.line : COLORS.manila, color: isDone ? COLORS.inkDim : COLORS.ink2 }}
          className="relative rounded-lg p-5 pl-8 text-left w-full focus:outline-none focus:ring-2 transition-all hover:scale-102 active:scale-98 cursor-pointer"
        >
          <PunchHole bg={isDone ? COLORS.line : COLORS.manila} />
          <div className="flex items-start justify-between gap-3">
            <div className="flex-1 min-w-0">
              <p className="font-mono text-xs mb-1 font-semibold" style={{ color: isDone ? COLORS.line : '#5B5342' }}>{o.unit}</p>
              <p className="font-body font-semibold text-base leading-snug mb-2">{getLocalizedText(o.description, lang) || t('noDescription')}</p>
              <div className="flex flex-wrap items-center gap-4 font-mono text-xs" style={{ color: isDone ? COLORS.line : '#5B5342', opacity: isDone ? 0.6 : 1 }}>
                {getAssignedMechanics(o).length > 0 && <span>👤 {getAssignedMechanics(o).join(', ')}</span>}
                {o.dueDate && <span>📅 {fmtDate(o.dueDate)}</span>}
              </div>
            </div>
            <div className="flex flex-col items-end gap-2">
              <StatusStamp status={o.status} small t={t} />
              {!isDone && (
                <button
                  type="button"
                  onClick={(e) => { e.stopPropagation(); pullOffBoard(o.id); }}
                  title="Take off the board — waiting on parts, etc."
                  className="text-xs px-2 py-1 rounded-full focus:outline-none"
                  style={{ color: '#8A7F5E', background: 'rgba(0,0,0,0.08)' }}
                >
                  ✕
                </button>
              )}
            </div>
          </div>
        </div>
      );
    };

    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <FireworksOverlay show={showFireworks} />
        <OfflineBanner isOnline={isOnline} />
        <PinModalOverlay
          pinModal={pinModal}
          pinInput={pinInput}
          setPinInput={setPinInput}
          pinError={pinError}
          onSubmit={submitPin}
          onCancel={cancelPinModal}
          onForgot={forgotPin}
          t={t}
        />
        <EmailPromptOverlay
          show={showEmailPrompt}
          onSave={async (email) => {
            await saveMechanicEmail(currentMechanic, email);
            setShowEmailPrompt(false);
          }}
          onSkip={() => setShowEmailPrompt(false)}
        />
        <PushPromptOverlay
          show={showPushPrompt}
          mechanic={currentMechanic}
          onEnable={async () => {
            await registerPushNotifications(currentMechanic);
            setShowPushPrompt(false);
          }}
          onSkip={() => setShowPushPrompt(false)}
        />
        <BiometricOfferOverlay
          mechanic={offerBiometric}
          onEnable={async () => {
            const name = offerBiometric;
            setOfferBiometric(null);
            try {
              await registerBiometric(name);
            } catch (e) {
              // ignore — user can enable it later from the board
            }
          }}
          onSkip={() => setOfferBiometric(null)}
        />
        <ClockInPromptOverlay
          show={showClockInPrompt}
          mechanic={currentMechanic}
          onClockIn={async () => {
            setShowClockInPrompt(false);
            await clockIn();
          }}
          onSkip={() => setShowClockInPrompt(false)}
          t={t}
        />
        <MilestonePromptOverlay
          prompt={milestonePrompt}
          onSubmit={(text) => resolveMilestonePrompt(text)}
          onSkip={() => resolveMilestonePrompt('')}
        />
        <div className="max-w-5xl mx-auto">
          <div className="flex items-start justify-between mb-10">
            <div>
              <p className="font-display text-xs uppercase tracking-[0.3em] mb-2" style={{ color: COLORS.accent }}>Harder Contracting</p>
              <h1 className="font-display text-3xl sm:text-4xl font-bold">{t('board')}</h1>
            </div>
            <button
              onClick={() => setShowSidebar(true)}
              className="text-3xl leading-none px-3 py-2 rounded-lg transition-all hover:scale-105"
              style={{ color: COLORS.accent, background: COLORS.surface, border: `1px solid ${COLORS.line}` }}
            >
              ☰
            </button>
          </div>

          <SidebarMenu
            show={showSidebar}
            onClose={() => setShowSidebar(false)}
            mechanic={currentMechanic}
            isAdmin={isAdmin}
            isForeman={isForeman}
            isProduction={jobTypeFor(currentMechanic) === 'production'}
            onNavigate={(s) => setScreen(s)}
            onCheckUpdates={async () => {
              try {
                const regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map((r) => r.unregister()));
                const keys = await caches.keys();
                await Promise.all(keys.map((k) => caches.delete(k)));
              } catch (e) {
                // ignore — reload will still fetch fresh from network
              }
              window.location.reload(true);
            }}
            onLogout={async () => {
              const keepSession = !!localStorage.getItem('webauthn_cred_' + currentMechanic);
              if (!keepSession && !navigator.onLine) {
                const proceed = confirm("You're offline right now. Logging out means you won't be able to sign back in until you have signal again. Log out anyway?");
                if (!proceed) return;
              }
              if (!keepSession) { await firebase.auth().signOut().catch(() => {}); }
              setCurrentMechanic(null);
              setScreen('login');
              setShowClockInPrompt(false);
            }}
            t={t}
          />

          {(() => {
            const bannerJobType = jobTypeFor(currentMechanic);
            const isOpen = bannerJobType === 'mechanic' ? !!openEntry : !!openProductionShift;
            return (
              <button
                onClick={() => setScreen('shift')}
                className="w-full flex items-center justify-between rounded-2xl px-6 py-6 mb-8 transition-all hover:scale-102 active:scale-98 focus:outline-none focus:ring-2 shop-card"
                style={{
                  background: isOpen ? COLORS.accent : COLORS.surface,
                  border: `3px solid ${isOpen ? COLORS.accent : COLORS.line}`,
                }}
              >
                {bannerJobType === 'mechanic' ? (
                  <React.Fragment>
                    <div className="flex items-center gap-4">
                      <span style={{ fontSize: '2.5rem' }}>⏱️</span>
                      <div className="text-left">
                        <p className="font-display text-xl font-bold" style={{ color: openEntry ? '#1B1F19' : COLORS.ink }}>
                          {openEntry ? t('clockedIn') : t('timeClock')}
                        </p>
                        <p className="text-sm" style={{ color: openEntry ? '#1B1F19' : COLORS.inkDim, opacity: openEntry ? 0.75 : 1 }}>
                          {openEntry ? `${t('clockedInSince')} ${fmtTime(openEntry.clockIn)} — ${t('sinceTapToLog')}` : t('tapToClockIn')}
                        </p>
                      </div>
                    </div>
                    <span style={{ fontSize: '2rem', color: openEntry ? '#1B1F19' : COLORS.inkDim }}>→</span>
                  </React.Fragment>
                ) : (
                  <React.Fragment>
                    <div className="flex items-center gap-4">
                      <span style={{ fontSize: '2.5rem' }}>⏱️</span>
                      <div className="text-left">
                        <p className="font-display text-xl font-bold" style={{ color: openProductionShift ? '#1B1F19' : COLORS.ink }}>
                          {openProductionShift ? 'On shift' : 'Shift'}
                        </p>
                        <p className="text-sm" style={{ color: openProductionShift ? '#1B1F19' : COLORS.inkDim, opacity: openProductionShift ? 0.75 : 1 }}>
                          {openProductionShift ? `${openProductionShift.machine} — since ${fmtTime(openProductionShift.start)}` : 'Tap to clock in for the day'}
                        </p>
                      </div>
                    </div>
                    <span style={{ fontSize: '2rem', color: openProductionShift ? '#1B1F19' : COLORS.inkDim }}>→</span>
                  </React.Fragment>
                )}
              </button>
            );
          })()}

          <div className="relative mb-8">
            <input
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              placeholder={t('searchPlaceholder')}
              className="w-full rounded-xl px-5 py-4 text-base focus:outline-none focus:ring-2"
              style={{ background: COLORS.surface, color: COLORS.ink, border: `2px solid ${COLORS.line}` }}
            />
            {searchQuery && (
              <button
                onClick={() => setSearchQuery('')}
                className="absolute right-4 top-1/2 -translate-y-1/2 text-lg"
                style={{ color: COLORS.inkDim }}
              >
                ✕
              </button>
            )}
          </div>

          {q ? (
            <div>
              <h2 className="font-display text-lg font-semibold uppercase tracking-wide mb-5">
                {searchResults.length} result{searchResults.length !== 1 ? 's' : ''} for "{searchQuery}"
              </h2>
              {searchResults.length === 0 ? (
                <div className="rounded-lg p-10 text-center" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>
                  <p className="text-base" style={{ color: COLORS.inkDim }}>{t('noOrdersMatchSearch')}</p>
                </div>
              ) : (
                <div className="space-y-3">{searchResults.map(renderOrderCard)}</div>
              )}
            </div>
          ) : (
            <React.Fragment>
              <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
                <h2 className="font-display text-lg font-semibold uppercase tracking-wide">{t('openWorkOrders')}</h2>
                <div className="flex gap-2 flex-wrap">
                  <select
                    value=""
                    onChange={(e) => { if (e.target.value) pullOntoBoard(e.target.value); }}
                    disabled={queuedOrders.length === 0}
                    className="text-xs font-display uppercase tracking-wider font-semibold px-2 py-1.5 rounded-lg focus:outline-none focus:ring-2"
                    style={{ color: COLORS.accent, background: COLORS.surface, border: `1px solid ${COLORS.line}`, opacity: queuedOrders.length === 0 ? 0.5 : 1 }}
                  >
                    <option value="">
                      {queuedOrders.length === 0 ? 'Nothing queued' : `+ Pull a job onto the board (${queuedOrders.length} queued)`}
                    </option>
                    {queuedUnitGroups.map((unit) => (
                      <optgroup key={unit} label={unit}>
                        {queuedByUnit[unit].map((o) => (
                          <option key={o.id} value={o.id}>
                            {getLocalizedText(o.description, lang) || t('noDescription')}
                          </option>
                        ))}
                      </optgroup>
                    ))}
                  </select>
                  <button
                    onClick={() => setScreen('machines')}
                    className="font-display text-xs uppercase tracking-wider font-semibold px-3 py-2 rounded-lg transition-all hover:scale-105"
                    style={{ color: COLORS.inkDim, background: COLORS.surface, border: `1px solid ${COLORS.line}` }}
                  >
                    {t('viewByMachine')}
                  </button>
                  <label
                    className="font-display font-bold uppercase tracking-wide text-sm px-4 py-3 rounded-xl transition-all cursor-pointer text-center"
                    style={{ background: COLORS.surfaceRaised, color: COLORS.accent, border: `2px solid ${COLORS.accent}` }}
                  >
                    {scanningReceipt ? 'Reading photo…' : '📷 Scan a receipt'}
                    <input
                      type="file"
                      accept="image/*"
                      capture="environment"
                      className="hidden"
                      disabled={scanningReceipt}
                      onChange={(e) => {
                        const file = e.target.files && e.target.files[0];
                        if (file) handleScanReceipt(file);
                        e.target.value = '';
                      }}
                    />
                  </label>
                  <Btn onClick={() => setShowAddOrder((s) => !s)}>{t('newWorkOrder')}</Btn>
                </div>
              </div>

              {showAddOrder && (
                <NewOrderForm
                  mechanics={mechanics}
                  units={units}
                  onCancel={() => { setShowAddOrder(false); setScanReviewData(null); }}
                  onSubmit={(data) => createOrder(data, scanReviewData ? scanReviewData.photoDataUrl : null)}
                  initialDescription={scanReviewData ? scanReviewData.description : ''}
                  initialUnit={scanReviewData ? scanReviewData.unit : ''}
                  scanBanner={!!scanReviewData}
                  t={t}
                />
              )}

              {visibleOpenOrders.length === 0 ? (
                <div className="rounded-lg p-10 text-center" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>
                  <p className="font-body text-base mb-2" style={{ color: COLORS.inkDim }}>
                    {queuedOrders.length > 0 ? 'Board is clear' : 'All caught up!'}
                  </p>
                  <p className="font-body text-sm" style={{ color: COLORS.line }}>
                    {queuedOrders.length > 0
                      ? `${queuedOrders.length} job${queuedOrders.length !== 1 ? 's' : ''} waiting in the dropdown above — pull one out when you're ready to start it.`
                      : t('noOpenOrders')}
                  </p>
                </div>
              ) : (
                <div className="space-y-3">
                  {visibleOpenOrders.map(renderOrderCard)}
                </div>
              )}
            </React.Fragment>
          )}

          <p className="font-body text-xs mt-12 text-center" style={{ color: COLORS.line }}>All mechanics see the same board in real time</p>
        </div>
      </div>
    );
  }

  // ---------- MACHINES (grouped by unit) ----------
  if (screen === 'machines') {
    const counts = (unit) => {
      const list = orders.filter((o) => o.unit === unit);
      return {
        Open: list.filter((o) => o.status === 'Open').length,
        'In Progress': list.filter((o) => o.status === 'In Progress').length,
        Done: list.filter((o) => o.status === 'Done').length,
      };
    };
    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <FireworksOverlay show={showFireworks} />
        <OfflineBanner isOnline={isOnline} />
        <PinModalOverlay
          pinModal={pinModal}
          pinInput={pinInput}
          setPinInput={setPinInput}
          pinError={pinError}
          onSubmit={submitPin}
          onCancel={cancelPinModal}
          onForgot={forgotPin}
          t={t}
        />
        <EmailPromptOverlay
          show={showEmailPrompt}
          onSave={async (email) => {
            await saveMechanicEmail(currentMechanic, email);
            setShowEmailPrompt(false);
          }}
          onSkip={() => setShowEmailPrompt(false)}
        />
        <PushPromptOverlay
          show={showPushPrompt}
          mechanic={currentMechanic}
          onEnable={async () => {
            await registerPushNotifications(currentMechanic);
            setShowPushPrompt(false);
          }}
          onSkip={() => setShowPushPrompt(false)}
        />
        <BiometricOfferOverlay
          mechanic={offerBiometric}
          onEnable={async () => {
            const name = offerBiometric;
            setOfferBiometric(null);
            try {
              await registerBiometric(name);
            } catch (e) {
              // ignore
            }
          }}
          onSkip={() => setOfferBiometric(null)}
        />
        <div className="max-w-5xl mx-auto">
          <button onClick={() => setScreen(landingScreenFor(currentMechanic))} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>

          <div className="flex items-center justify-between mb-5">
            <h2 className="font-display text-lg font-semibold uppercase tracking-wide">Your machines</h2>
            <Btn variant="ghost" onClick={() => setShowAddUnit((s) => !s)}>+ Add machine</Btn>
          </div>

          {showAddUnit && (
            <div className="flex flex-col sm:flex-row gap-2 mb-5">
              <input
                value={newUnitName}
                onChange={(e) => setNewUnitName(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && addUnit(newUnitTypeDraft)}
                placeholder="Unit number, e.g. UNIT-104"
                className="flex-1 rounded-sm px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
              />
              <select
                value={newUnitTypeDraft}
                onChange={(e) => setNewUnitTypeDraft(e.target.value)}
                className="rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-2"
                style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                title="Optional — tags it for Timesheets tracking"
              >
                <option value="">— Untagged —</option>
                {Object.entries(SUPPORT_TYPE_LABELS).map(([type, label]) => (
                  <option key={type} value={type}>{label}</option>
                ))}
                {Object.entries(MACHINE_TYPE_LABELS).map(([type, label]) => (
                  <option key={type} value={type}>{label}</option>
                ))}
              </select>
              <Btn onClick={() => addUnit(newUnitTypeDraft)}>Add</Btn>
            </div>
          )}

          {units.length === 0 ? (
            <div className="rounded-lg p-10 text-center" style={{ background: COLORS.surface, border: `2px dashed ${COLORS.line}` }}>
              <p className="font-body text-base mb-4" style={{ color: COLORS.inkDim }}>No machines added yet</p>
              <p className="font-body text-sm" style={{ color: COLORS.line }}>Tap "Add machine" above to get started</p>
            </div>
          ) : (
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
              {units.map((u) => {
                const c = counts(u);
                const totalJobs = c.Open + c['In Progress'] + c.Done;
                return (
                  <button
                    key={u}
                    onClick={() => { setActiveUnit(u); setScreen('unit'); }}
                    className="text-left rounded-lg p-5 focus:outline-none focus:ring-2 transition-all hover:scale-105 active:scale-95"
                    style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}
                  >
                    <p className="font-mono text-xl font-semibold mb-4 truncate">{u}</p>
                    <div className="space-y-2">
                      <div className="flex items-center justify-between text-sm">
                        <span style={{ color: COLORS.open }}>📋 {t('statusOpen')}</span>
                        <span className="font-semibold" style={{ color: COLORS.open }}>{c.Open}</span>
                      </div>
                      <div className="flex items-center justify-between text-sm">
                        <span style={{ color: COLORS.progress }}>🔧 {t('statusInProgress')}</span>
                        <span className="font-semibold" style={{ color: COLORS.progress }}>{c['In Progress']}</span>
                      </div>
                      <div className="flex items-center justify-between text-sm">
                        <span style={{ color: COLORS.done }}>✓ {t('statusDone')}</span>
                        <span className="font-semibold" style={{ color: COLORS.done }}>{c.Done}</span>
                      </div>
                    </div>
                    {totalJobs > 0 && (
                      <div className="mt-3 pt-3 border-t" style={{ borderColor: COLORS.line }}>
                        <span className="text-xs font-display uppercase tracking-wide" style={{ color: COLORS.inkDim }}>
                          {totalJobs} job{totalJobs !== 1 ? 's' : ''} total
                        </span>
                      </div>
                    )}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      </div>
    );
  }


  // ---------- TIME CLOCK ----------
  // ---------- SHIFT (unified — routes by job type) ----------
  if (screen === 'shift') {
    // People with alternates set (e.g. a mechanic who also drives the
    // winch truck) default straight to their normal, primary role — same
    // as everyone else, no extra step. A dropdown further down lets them
    // pick a different one for today on the rare day they need to.
    const effectiveJobType = todaysJobChoice ? jobTypeForValue(todaysJobChoice) : jobTypeFor(currentMechanic);
    const effectiveUnit = todaysJobChoice ? (todaysJobChoice === '__mechanic__' ? '' : todaysJobChoice) : assignedUnitFor(currentMechanic);

    if (showPreTripForm) {
      return (
        <PreTripInspectionForm
          driver={currentMechanic}
          truckUnitName={effectiveUnit}
          onCancel={() => setShowPreTripForm(false)}
          onSubmit={async (unitsData, signature) => {
            await submitPreTripInspection(unitsData, signature);
            setShowPreTripForm(false);
          }}
        />
      );
    }

    if (showInspectionMode) {
      return (
        <InspectionModeScreen
          driver={currentMechanic}
          allLogs={driverLogs}
          onExit={() => setShowInspectionMode(false)}
        />
      );
    }

    // Mechanics get the exact same screen they've always had — this just
    // hands off to it, using the same redirect pattern already used
    // elsewhere in this file (e.g. Order Detail when an order isn't found).
    if (effectiveJobType === 'mechanic') {
      setScreen('timeclock');
      return null;
    }

    const activeType = openProductionShift ? machineType(openProductionShift.machine, unitTypes) : machineType(effectiveUnit, unitTypes);
    const myProductionShifts = productionShifts
      .filter((s) => s.employee === currentMechanic && s.end)
      .sort((a, b) => b.end.localeCompare(a.end))
      .slice(0, 10);

    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <SidebarMenu
          show={showSidebar}
          onClose={() => setShowSidebar(false)}
          mechanic={currentMechanic}
          isProduction={jobTypeFor(currentMechanic) === 'production'}
          isForeman={isForeman}
          isAdmin={isAdmin}
          onNavigate={(s) => setScreen(s)}
          onCheckUpdates={async () => {
            try {
              const regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map((r) => r.unregister()));
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
            } catch (e) {}
            window.location.reload(true);
          }}
          onLogout={async () => {
            const keepSession = !!localStorage.getItem('webauthn_cred_' + currentMechanic);
            if (!keepSession && !navigator.onLine) {
              const proceed = confirm("You're offline right now. Logging out means you won't be able to sign back in until you have signal again. Log out anyway?");
              if (!proceed) return;
            }
            if (!keepSession) { await firebase.auth().signOut().catch(() => {}); }
            setCurrentMechanic(null);
            setScreen('login');
          }}
          t={t}
        />
        <div className="max-w-lg mx-auto">
          <div className="flex items-center justify-between mb-8">
            <div>
              <p className="font-display text-xs uppercase tracking-[0.3em] mb-1" style={{ color: COLORS.accent }}>Harder Contracting</p>
              <h1 className="font-display text-2xl font-bold">Shift</h1>
            </div>
            <button onClick={() => setShowSidebar(true)} className="text-3xl leading-none px-3 py-2 rounded-lg" style={{ color: COLORS.accent, background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>☰</button>
          </div>

          {!openProductionShift ? (
            <div className="rounded-lg p-8 text-center" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
              <p className="text-base mb-5" style={{ color: COLORS.inkDim }}>Not clocked in</p>
              <Btn onClick={() => startProductionShift(effectiveUnit || undefined)}>Clock In</Btn>
              {hasAltRole(currentMechanic) && (
                <div className="mt-4 text-left">
                  <label className="block text-xs mb-1" style={{ color: COLORS.inkDim }}>Working as today:</label>
                  <select
                    value={todaysJobChoice || altOptionsFor(currentMechanic)[0].value}
                    onChange={(e) => setTodaysJobChoice(e.target.value)}
                    className="w-full rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2"
                    style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                  >
                    {altOptionsFor(currentMechanic).map((opt) => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                  </select>
                </div>
              )}
            </div>
          ) : (
            <React.Fragment>
              <div className="rounded-lg p-4 mb-5 flex items-center justify-between" style={{ background: COLORS.surface, border: `2px solid ${COLORS.accent}` }}>
                <div>
                  <p className="text-xs uppercase tracking-wide" style={{ color: COLORS.inkDim }}>On shift since</p>
                  <p className="font-display text-lg font-bold">{fmtTime(openProductionShift.start)}</p>
                </div>
              </div>

              <Section label="Machine">
                {roleFor(currentMechanic) === 'employee' ? (
                  <div className="rounded-lg px-4 py-2.5 text-base font-semibold" style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}>
                    🚜 {openProductionShift.machine}
                  </div>
                ) : (
                  <Select value={openProductionShift.machine} onChange={(e) => patchOpenProductionShift({ machine: e.target.value })}>
                    {units.filter((u) => u && MACHINE_TYPE_LABELS[unitTypes[slugForUnit(u)]]).map((u) => <option key={u} value={u}>{u}</option>)}
                  </Select>
                )}
              </Section>

              {activeType !== 'fuel' && activeType !== 'winch' && (
                <Section label="Block number">
                  <div className="flex gap-2">
                    <Select value={openProductionShift.block} onChange={(e) => patchOpenProductionShift({ block: e.target.value })} className="flex-1">
                      <option value="" disabled>Select block…</option>
                      {blocks.map((b) => <option key={b} value={b}>{b}</option>)}
                    </Select>
                  </div>
                  <div className="flex gap-2 mt-2">
                    <TextInput value={newBlockText} onChange={(e) => setNewBlockText(e.target.value)} placeholder="Add new block, e.g. 40-A" className="flex-1" />
                    <Btn onClick={async () => { await addBlock(newBlockText); patchOpenProductionShift({ block: newBlockText.trim() }); setNewBlockText(''); }} disabled={!newBlockText.trim()}>Add</Btn>
                  </div>
                </Section>
              )}

              {activeType !== 'crawler' && activeType !== 'grader' && activeType !== 'winch' && activeType !== 'fuel' && (
                <Section label="Machine hours">
                  <div className="grid grid-cols-2 gap-3">
                    <TextInput type="number" inputMode="decimal" placeholder="Start" value={openProductionShift.startHours} onChange={(e) => patchOpenProductionShift({ startHours: e.target.value })} />
                    <TextInput type="number" inputMode="decimal" placeholder="End" value={openProductionShift.endHours} onChange={(e) => patchOpenProductionShift({ endHours: e.target.value })} />
                  </div>
                </Section>
              )}

              {activeType === 'buncher' && (
                <Section label="Tree count (end of shift)">
                  <TextInput type="number" inputMode="numeric" placeholder="0" value={openProductionShift.trees} onChange={(e) => patchOpenProductionShift({ trees: e.target.value })} />
                </Section>
              )}
              {(activeType === 'skidder' || activeType === 'processor') && (
                <Section label="Production count (end of shift)">
                  <div className="grid grid-cols-2 gap-3">
                    <TextInput type="number" inputMode="numeric" placeholder="Spruce" value={openProductionShift.spruce} onChange={(e) => patchOpenProductionShift({ spruce: e.target.value })} />
                    <TextInput type="number" inputMode="numeric" placeholder="Aspen" value={openProductionShift.aspen} onChange={(e) => patchOpenProductionShift({ aspen: e.target.value })} />
                  </div>
                </Section>
              )}
              {activeType === 'loader' && (
                <Section label="Load count (end of shift)">
                  <div className="grid grid-cols-2 gap-3">
                    <TextInput type="number" inputMode="numeric" placeholder="Loads" value={openProductionShift.loadCount} onChange={(e) => patchOpenProductionShift({ loadCount: e.target.value })} />
                    <TextInput type="number" inputMode="numeric" placeholder="Top piles" value={openProductionShift.topPileCount} onChange={(e) => patchOpenProductionShift({ topPileCount: e.target.value })} />
                  </div>
                </Section>
              )}
              {activeType === 'fuel' && (
                <Section label="Fuel delivery log">
                  <div className="space-y-2">
                    {units.filter((u) => u && MACHINE_TYPE_LABELS[unitTypes[slugForUnit(u)]] && unitTypes[slugForUnit(u)] !== 'fuel').map((u) => (
                      <div key={u} className="rounded-lg p-3 flex items-center justify-between" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>
                        <span className="text-sm">{u}</span>
                        <div className="flex items-center gap-2">
                          <input
                            type="number" inputMode="decimal" placeholder="0"
                            value={((openProductionShift.fuelLog || {})[u] || [''])[0] || ''}
                            onChange={(e) => patchOpenProductionShift({ fuelLog: { ...openProductionShift.fuelLog, [u]: [e.target.value] } })}
                            className="w-20 rounded-lg px-2 py-1.5 text-sm text-right font-mono focus:outline-none focus:ring-2"
                            style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                          />
                          <span className="text-xs" style={{ color: COLORS.inkDim }}>L</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </Section>
              )}

              <ExtraTasksEditor shift={openProductionShift} onAdd={addExtraTask} onRemove={removeExtraTask} />

              <Section label="Notes">
                <textarea
                  value={openProductionShift.notes}
                  onChange={(e) => patchOpenProductionShift({ notes: e.target.value })}
                  placeholder="Anything else worth logging…"
                  rows={3}
                  className="w-full rounded-lg px-4 py-2.5 text-base focus:outline-none focus:ring-2 resize-none"
                  style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                />
              </Section>

              <DowntimeButton onLog={logDowntime} />

              <div className="mt-6">
                <Btn onClick={attemptProductionClockOut} className="w-full">Clock Out</Btn>
              </div>
            </React.Fragment>
          )}

          {activeType === 'winch' && (
            <DriverLogSection
              driver={currentMechanic}
              openLog={openDriverLog}
              allLogs={driverLogs}
              onStart={startDriverLog}
              onAddStatus={addDriverStatusChange}
              onEnd={endDriverLog}
              onUpdateStatusChange={updateDriverStatusChange}
              hasValidInspection={hasValidInspection(effectiveUnit, currentMechanic)}
              inspectionHoursRemaining={(() => {
                const latest = latestInspectionFor(effectiveUnit, currentMechanic);
                if (!latest) return null;
                const elapsedHrs = (Date.now() - new Date(latest.time).getTime()) / (1000 * 60 * 60);
                return 24 - elapsedHrs;
              })()}
              onOpenPreTrip={() => setShowPreTripForm(true)}
              onOpenInspectionMode={() => setShowInspectionMode(true)}
              isAdmin={isAdmin}
            />
          )}

          {activeType === 'winch' && (
            <DriverRecentLogsSection
              driver={currentMechanic}
              allLogs={driverLogs}
              onBackfillOffDuty={backfillOffDutyDriverLogs}
            />
          )}

          <ProductionClockOutReviewOverlay
            show={showProductionClockOutReview}
            shift={openProductionShift}
            mechanic={currentMechanic}
            unitTypes={unitTypes}
            onConfirm={confirmProductionClockOut}
            onCancel={() => setShowProductionClockOutReview(false)}
          />

          <ProductionShiftHistory
            shifts={myProductionShifts}
            editingId={editingShiftId}
            onEdit={(id) => setEditingShiftId(id)}
            onCancelEdit={() => setEditingShiftId(null)}
            onSave={updateProductionShift}
            onDelete={deleteProductionShift}
            unitTypes={unitTypes}
            units={units}
            isAdmin={isAdmin}
          />
        </div>
      </div>
    );
  }

  if (screen === 'timeclock') {
    const myEntries = timesheets
      .filter((t) => t.mechanic === currentMechanic)
      .slice()
      .sort((a, b) => b.date.localeCompare(a.date) || (b.clockIn || '').localeCompare(a.clockIn || ''));
    const onLunch = openEntry && openEntry.lunchStart && !openEntry.lunchEnd;

    return (
      <div style={{ background: COLORS.bg, color: COLORS.ink, minHeight: '100vh' }} className="font-body p-5 sm:p-8">
        {FONT_STYLE}
        <OfflineBanner isOnline={isOnline} />
        <div className="max-w-2xl mx-auto">
          <button onClick={() => setScreen(landingScreenFor(currentMechanic))} className="font-display text-xs uppercase tracking-wider mb-6 focus:outline-none hover:opacity-70 transition-opacity" style={{ color: COLORS.inkDim }}>
            {t('backToBoard')}
          </button>
          <h1 className="font-display text-3xl font-bold mb-2">{t('timeClock')}</h1>
          <p className="text-sm mb-8" style={{ color: COLORS.inkDim }}>{currentMechanic}</p>

          {/* Current status card */}
          <div className="rounded-lg p-6 mb-8 text-center" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}` }}>
            {!openEntry ? (
              <React.Fragment>
                <p className="text-base mb-5" style={{ color: COLORS.inkDim }}>{t('notClockedIn')}</p>
                <Btn onClick={clockIn} disabled={timeClockActionPending}>{timeClockActionPending ? '…' : t('clockIn')}</Btn>
                {hasAltRole(currentMechanic) && (
                  <div className="mt-4 text-left">
                    <label className="block text-xs mb-1" style={{ color: COLORS.inkDim }}>Working as today:</label>
                    <select
                      value={todaysJobChoice || altOptionsFor(currentMechanic)[0].value}
                      onChange={(e) => { setTodaysJobChoice(e.target.value); setScreen('shift'); }}
                      className="w-full rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2"
                      style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                    >
                      {altOptionsFor(currentMechanic).map((opt) => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                    </select>
                  </div>
                )}
              </React.Fragment>
            ) : (
              <React.Fragment>
                <p className="font-mono text-sm mb-1" style={{ color: COLORS.inkDim }}>{t('clockedInAt')}</p>
                <p className="font-display text-2xl font-bold mb-5">{fmtTime(openEntry.clockIn)}</p>

                {onLunch ? (
                  <React.Fragment>
                    <p className="text-sm mb-4" style={{ color: COLORS.progress }}>{t('onBreakSince')} {fmtTime(openEntry.lunchStart)}</p>
                    <Btn onClick={endLunch} disabled={timeClockActionPending}>{timeClockActionPending ? '…' : t('endBreak')}</Btn>
                  </React.Fragment>
                ) : (
                  <div className="flex flex-col gap-3 items-center">
                    {openEntry.lunchStart && openEntry.lunchEnd && (
                      <p className="text-xs font-mono" style={{ color: COLORS.inkDim }}>
                        {t('breakLabel')}: {fmtTime(openEntry.lunchStart)} – {fmtTime(openEntry.lunchEnd)}
                      </p>
                    )}
                    <div className="flex gap-3">
                      {!openEntry.lunchStart && (
                        <Btn variant="ghost" onClick={startLunch} disabled={timeClockActionPending}>{timeClockActionPending ? '…' : t('startBreak')}</Btn>
                      )}
                      <Btn onClick={attemptClockOut} disabled={timeClockActionPending}>{t('clockOut')}</Btn>
                    </div>
                  </div>
                )}
              </React.Fragment>
            )}
          </div>

          {lunchPrompt && (
            <div className="fixed inset-0 z-50 p-6" style={{ background: 'rgba(0,0,0,0.75)', minHeight: '100vh' }}>
              <div className="w-full max-w-xs mx-auto my-8 rounded-2xl p-6 overflow-y-auto" style={{ background: COLORS.surface, border: `2px solid ${COLORS.line}`, maxHeight: '85vh' }}>
                <p className="font-display text-lg font-bold mb-3 text-center">{t('noBreakLoggedToday')}</p>
                <p className="text-sm mb-5 text-center" style={{ color: COLORS.inkDim }}>
                  {t('goBackBreakReminder')}
                </p>
                <div className="flex flex-col gap-2">
                  <Btn variant="ghost" onClick={() => setLunchPrompt(false)}>{t('goBack')}</Btn>
                  <Btn variant="danger" onClick={() => { setLunchPrompt(false); setPendingClockOutSkippedLunch(true); }}>{t('workedStraightThrough')}</Btn>
                </div>
              </div>
            </div>
          )}

          <ClockOutReviewOverlay
            show={pendingClockOutSkippedLunch !== null}
            openEntry={openEntry}
            skippedLunch={pendingClockOutSkippedLunch}
            mechanic={currentMechanic}
            onConfirm={(signature) => clockOut(pendingClockOutSkippedLunch, signature)}
            onCancel={() => setPendingClockOutSkippedLunch(null)}
          />

          {/* Jobs worked on today */}
          {openEntry && (
            <div className="mb-8">
              <h2 className="font-display text-lg font-semibold uppercase tracking-wide mb-4">{t('whatDidYouWorkOn')}</h2>
              <TimesheetJobsEditor entry={openEntry} onAdd={addTimesheetJob} onRemove={removeTimesheetJob} />

          {/* Add a missed day */}
          {showAddMissedDay ? (
            <AddMissedDayForm

          {/* Past entries */}
          <div className="rounded-lg p-5 mb-8" style={{ background: COLORS.surface, border: `1px solid ${COLORS.line}` }}>

            <div className="grid grid-cols-2 gap-3 mb-3">

                <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>{t('from')}</span>
                <input
                  type="date"

                  className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                  style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                />
              </label>
              <label className="block">
                <span className="text-xs block mb-1" style={{ color: COLORS.inkDim }}>{t('to')}</span>
                <input
                  type="date"
                  value={mySummaryEnd}
                  onChange={(e) => setMySummaryEnd(e.target.value)}
                  className="w-full rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:ring-2"
                  style={{ background: COLORS.surfaceRaised, color: COLORS.ink, border: `1px solid ${COLORS.line}` }}
                />
              </label>
            </div>
            {mySummaryStart && mySummaryEnd ? (
              <p className="font-display text-xl font-bold" style={{ color: COLORS.accent }}>
                {fmtHours(
                  myEntries
                    .filter((e) => e.date >= mySummaryStart && e.date <= mySummaryEnd)
